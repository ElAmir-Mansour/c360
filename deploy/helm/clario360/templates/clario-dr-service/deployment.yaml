{{- if .Values.clarioDrService.enabled }}
{{- $drSecretName := default (printf "%s-dr-credentials" (include "clario360.fullname" .)) .Values.clarioDrService.existingSecret }}
{{- $jwtSecretName := default (default (printf "%s-jwt-keys" (include "clario360.fullname" .)) .Values.jwt.existingSecret) .Values.secrets.jwt.existingSecret }}
{{- $minioSecretName := default (default (printf "%s-minio-credentials" (include "clario360.fullname" .)) .Values.minio.existingSecret) .Values.secrets.minio.existingSecret }}
{{- $redisSecretName := default (default (printf "%s-redis-credentials" (include "clario360.fullname" .)) .Values.redis.existingSecret) .Values.secrets.redis.existingSecret }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clario360.componentName" (dict "root" . "component" "clario-dr-service") }}
  namespace: {{ include "clario360.namespace" . }}
  labels:
    {{- include "clario360.componentLabels" (dict "root" . "component" "clario-dr-service") | nindent 4 }}
spec:
  {{- if not ((.Values.clarioDrService).autoscaling).enabled }}
  replicas: {{ .Values.clarioDrService.replicaCount | default 2 }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.clarioDrService.revisionHistoryLimit | default 5 }}
  selector:
    matchLabels:
      {{- include "clario360.componentSelectorLabels" (dict "root" . "component" "clario-dr-service") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/clario-dr-service/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/clario-dr-service/secret.yaml") . | sha256sum }}
        {{- include "clario360.prometheusAnnotations" (dict "metricsPort" "9097") | nindent 8 }}
        {{- with .Values.clarioDrService.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "clario360.componentSelectorLabels" (dict "root" . "component" "clario-dr-service") | nindent 8 }}
        {{- with .Values.clarioDrService.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "clario360.serviceAccountName" (dict "root" . "component" "clario-dr-service" "svcConfig" .Values.clarioDrService) }}
      securityContext:
        {{- include "clario360.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.clarioDrService.terminationGracePeriodSeconds | default 30 }}
      containers:
        - name: clario-dr-service
          image: {{ include "clario360.image" (dict "imageConfig" .Values.clarioDrService.image "root" . "defaultRepo" "clario360/clario-dr-service") }}
          imagePullPolicy: {{ .Values.clarioDrService.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            {{- include "clario360.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8097
              protocol: TCP
            - name: admin
              containerPort: 9097
              protocol: TCP
            - name: mtls
              containerPort: 8098
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "clario360.sharedConfigMapName" . }}
            - configMapRef:
                name: {{ include "clario360.componentName" (dict "root" . "component" "clario-dr-service") }}-config
          env:
            - name: DR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $drSecretName }}
                  key: DR_DB_URL
            - name: DR_KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "clario360.sharedConfigMapName" . }}
                  key: KAFKA_BROKERS
            - name: DR_JWT_PUBLIC_KEY_PATH
              value: "/etc/clario-dr/jwt/jwt-public-key.pem"
            - name: AUTH_RSA_PUBLIC_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: {{ $jwtSecretName }}
                  key: AUTH_RSA_PUBLIC_KEY_PEM
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $redisSecretName }}
                  key: REDIS_PASSWORD
                  optional: true
            - name: DR_MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $minioSecretName }}
                  key: MINIO_ACCESS_KEY
            - name: DR_MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $minioSecretName }}
                  key: MINIO_SECRET_KEY
            - name: DR_VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $drSecretName }}
                  key: DR_VAULT_TOKEN
                  optional: true
            - name: DR_VAULT_APPROLE_ROLE_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $drSecretName }}
                  key: DR_VAULT_APPROLE_ROLE_ID
                  optional: true
            - name: DR_VAULT_APPROLE_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $drSecretName }}
                  key: DR_VAULT_APPROLE_SECRET_ID
                  optional: true
            - name: DR_ENROLL_TOKEN_PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: {{ $drSecretName }}
                  key: DR_ENROLL_TOKEN_PRIVATE_KEY_PEM
                  optional: true
            - name: DR_ENROLL_TOKEN_PRIVATE_JWK
              valueFrom:
                secretKeyRef:
                  name: {{ $drSecretName }}
                  key: DR_ENROLL_TOKEN_PRIVATE_JWK
                  optional: true
            - name: DR_INTEGRATIONS_ENC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $drSecretName }}
                  key: DR_INTEGRATIONS_ENC_KEY
                  optional: true
            - name: DR_RPO_MONITOR_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: DR_FAILOVER_DRIVER_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_SERVICE_NAME
              value: "clario-dr-service"
            {{- with .Values.clarioDrService.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- include "clario360.healthProbes" (dict "portName" "http" "healthPath" "/healthz" "readyPath" "/readyz") | nindent 10 }}
          resources:
            {{- toYaml .Values.clarioDrService.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: jwt-public-key
              mountPath: /etc/clario-dr/jwt
              readOnly: true
            {{- if .Values.clarioDrService.mtls.existingSecret }}
            - name: mtls-certs
              mountPath: /etc/clario-dr/mtls
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: jwt-public-key
          secret:
            secretName: {{ $jwtSecretName }}
            items:
              - key: AUTH_RSA_PUBLIC_KEY_PEM
                path: jwt-public-key.pem
        {{- if .Values.clarioDrService.mtls.existingSecret }}
        - name: mtls-certs
          secret:
            secretName: {{ .Values.clarioDrService.mtls.existingSecret }}
        {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ if eq (default "development" .Values.global.environment) "production" }}DoNotSchedule{{ else }}ScheduleAnyway{{ end }}
          labelSelector:
            matchLabels:
              {{- include "clario360.componentSelectorLabels" (dict "root" . "component" "clario-dr-service") | nindent 14 }}
      {{- with .Values.clarioDrService.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clarioDrService.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clarioDrService.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
