openapi: 3.1.0
info:
  title: ClarioDR Service API
  version: 1.0.0
  summary: Disaster recovery control-plane and agent-ingest contract.
  description: |
    Phase 1 contract foundation for the existing ClarioDR API. The gateway
    exposes the tenant control plane at `/api/v1/dr` and gates it with the
    `suite.datastream` entitlement. Mutating control-plane writes stage DR
    lifecycle events through `backend/internal/events/outbox` before commit.
  x-contract-phase: phase-1-foundation
  x-gateway-contract:
    id: clario-dr-service
    version: 1.0.0
    api_version: v1
    fail_closed: false
    fail_closed_profiles:
      standard: false
      regulated: true
    regulated_posture:
      env:
        - DR_DEPLOYMENT_PROFILE=regulated
        - DR_REGULATED_MODE=true
      startup_validation: fail_closed
      readiness_check: dr_runtime_config
      required_runtime:
        - Vault Transit
        - MinIO WORM recovery-point bucket
        - Redis leader election
        - Kafka event bus
        - mTLS agent ingest
        - failover driver
        - integration credential encryption key
        - command recovery driver
  x-route-sources:
    - backend/cmd/clario-dr-service/main.go
    - backend/internal/dr/handler/handler.go
    - backend/internal/dr/enroll/handler.go
    - backend/internal/dr/ingest/handler.go
    - backend/cmd/clario-dr-service/resilience.go
    - backend/cmd/clario-dr-service/intelligence.go
    - backend/cmd/clario-dr-service/orchestration.go
    - backend/cmd/clario-dr-service/coverage.go
    - backend/cmd/clario-dr-service/sovereign.go
    - backend/internal/dr/instant/router.go
    - backend/internal/dr/journal/router.go
    - backend/internal/dr/appconsistent/router.go
    - backend/internal/dr/topology/router.go
    - backend/internal/dr/failback/handler.go
    - backend/internal/dr/predict/api.go
    - backend/internal/dr/registry/router.go
    - backend/internal/dr/ransomware/handler.go
    - backend/internal/dr/cleanroom/router.go
    - backend/internal/dr/copilot/handler.go
    - backend/internal/dr/runbookstudio/router.go
    - backend/internal/dr/drillsched/router.go
    - backend/internal/dr/bootgraph/router.go
    - backend/internal/dr/gameday/router.go
    - backend/internal/dr/rehearsalproof/router.go
    - backend/internal/dr/iacdr/router.go
    - backend/internal/dr/storageoffload/router.go
    - backend/internal/dr/vmcapture/router.go
    - backend/internal/dr/bcm/router.go
    - backend/internal/dr/assurance/router.go
    - backend/internal/dr/cybervault/router.go
    - backend/internal/dr/byok/router.go
    - backend/internal/dr/attestledger/router.go
  x-write-path-standard:
    package: backend/internal/events/outbox
    event_topics:
      - datastream.dr.events
      - datastream.dr.alerts
servers:
  - url: /api/v1/dr
    description: Gateway-routed tenant control plane.
security:
  - bearerAuth: []
    tenantContext: []
tags:
  - name: Enrollment
  - name: AppVerification
  - name: Posture
  - name: Sites
  - name: Groups
  - name: Streams
  - name: RecoveryPoints
  - name: InstantRecovery
  - name: Journal
  - name: AppConsistency
  - name: Topology
  - name: Agents
  - name: Failover
  - name: Failback
  - name: PredictiveRecovery
  - name: RecoveryRegistry
  - name: RecoveryTier
  - name: Ransomware
  - name: CleanRoom
  - name: Copilot
  - name: RunbookStudio
  - name: DrillScheduler
  - name: BootGraph
  - name: GameDay
  - name: RehearsalProof
  - name: IaCDR
  - name: StorageOffload
  - name: WorkloadCapture
  - name: BCM
  - name: Assurance
  - name: CyberVault
  - name: SelfDR
  - name: BYOK
  - name: AttestationLedger
  - name: Integrations
  - name: AgentIngest
paths:
  /posture:
    get:
      tags: [Posture]
      operationId: getDRPosture
      summary: Get dashboard-ready DR posture for the tenant.
      x-required-permission: dr:read
      responses:
        "200":
          description: DR posture summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DRPostureEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /integrations:
    get:
      tags: [Integrations]
      operationId: listDRIntegrations
      summary: List tenant-scoped disaster-recovery provider integrations.
      x-required-permission: dr:read
      responses:
        "200":
          description: Integration list with no credential material.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DRIntegrationListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Integrations]
      operationId: createDRIntegration
      summary: Create a provider integration with credentials encrypted at rest.
      x-required-permission: dr:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DRIntegrationRequest"
      responses:
        "201":
          description: Integration created; credential material is never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DRIntegrationEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /integrations/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Integrations]
      operationId: getDRIntegration
      summary: Get one provider integration without credential material.
      x-required-permission: dr:read
      responses:
        "200":
          description: Integration details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DRIntegrationEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Integrations]
      operationId: updateDRIntegration
      summary: Update integration metadata and, when supplied, rotate its encrypted credentials.
      x-required-permission: dr:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DRIntegrationRequest"
      responses:
        "200":
          description: Updated integration without credential material.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DRIntegrationEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Integrations]
      operationId: deleteDRIntegration
      summary: Delete a provider integration and its encrypted credential bundle.
      x-required-permission: dr:admin
      responses:
        "204":
          description: Integration deleted.
        "404":
          $ref: "#/components/responses/NotFound"
  /integrations/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Integrations]
      operationId: testDRIntegration
      summary: Test live connectivity using the stored encrypted credentials.
      x-required-permission: dr:write
      responses:
        "200":
          description: Integration with its updated connectivity status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DRIntegrationEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /agents/enroll:
    post:
      tags: [Enrollment]
      operationId: exchangeDRAgentEnrollment
      summary: Exchange a single-use enrollment token and CSR for an mTLS client certificate.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentExchangeRequest"
      responses:
        "200":
          description: Certificate issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentExchangeResponseEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /agents/{agentID}/enrollment-token:
    post:
      tags: [Enrollment]
      operationId: mintDRAgentEnrollmentToken
      summary: Mint a single-use enrollment or certificate-rotation token.
      x-required-permission: dr:write
      parameters:
        - $ref: "#/components/parameters/AgentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MintEnrollmentTokenRequest"
      responses:
        "201":
          description: Enrollment token minted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MintEnrollmentTokenResponseEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /app-verification:
    get:
      tags: [AppVerification]
      operationId: listDRAppVerificationResults
      summary: List persisted application-level verification results for a consistency group.
      x-required-permission: dr:read
      parameters:
        - name: group
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Application verification results.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /app-verification/{id}:
    get:
      tags: [AppVerification]
      operationId: getDRAppVerificationResult
      summary: Get one application-level verification result with per-check detail.
      x-required-permission: dr:read
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Application verification result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /sites:
    get:
      tags: [Sites]
      operationId: listDRSites
      summary: List protected sites.
      x-required-permission: dr:read
      responses:
        "200":
          description: Protected sites.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedSiteListEnvelope"
    post:
      tags: [Sites]
      operationId: createDRSite
      summary: Create a protected site.
      x-required-permission: dr:write
      x-outbox:
        topic: datastream.dr.events
        event_type: com.clario360.dr.site.created
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSiteRequest"
      responses:
        "201":
          description: Protected site created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedSiteEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
  /sites/{siteID}:
    get:
      tags: [Sites]
      operationId: getDRSite
      summary: Get a protected site.
      x-required-permission: dr:read
      parameters:
        - $ref: "#/components/parameters/SiteID"
      responses:
        "200":
          description: Protected site.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProtectedSiteEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /groups:
    get:
      tags: [Groups]
      operationId: listDRGroups
      summary: List consistency groups.
      x-required-permission: dr:read
      responses:
        "200":
          description: Consistency groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsistencyGroupListEnvelope"
    post:
      tags: [Groups]
      operationId: createDRGroup
      summary: Create a consistency group.
      x-required-permission: dr:write
      x-outbox:
        topic: datastream.dr.events
        event_type: com.clario360.dr.group.created
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: Consistency group created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsistencyGroupEnvelope"
  /groups/{groupID}:
    get:
      tags: [Groups]
      operationId: getDRGroup
      summary: Get a consistency group.
      x-required-permission: dr:read
      parameters:
        - $ref: "#/components/parameters/GroupID"
      responses:
        "200":
          description: Consistency group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsistencyGroupEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /groups/{groupID}/summary:
    get:
      tags: [Posture, Groups]
      operationId: getDRGroupSummary
      summary: Get a protection-group read model with member, RPO, recovery-point, and run posture.
      x-required-permission: dr:read
      parameters:
        - $ref: "#/components/parameters/GroupID"
      responses:
        "200":
          description: Protection-group summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DRGroupSummaryEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /groups/{groupID}/members:
    get:
      tags: [Groups]
      operationId: listDRGroupMembers
      summary: List group members.
      x-required-permission: dr:read
      parameters:
        - $ref: "#/components/parameters/GroupID"
      responses:
        "200":
          description: Group members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsistencyGroupMemberListEnvelope"
    post:
      tags: [Groups]
      operationId: addDRGroupMember
      summary: Add a protected site to a consistency group.
      x-required-permission: dr:write
      x-outbox:
        topic: datastream.dr.events
        event_type: com.clario360.dr.group.member_added
      parameters:
        - $ref: "#/components/parameters/GroupID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddGroupMemberRequest"
      responses:
        "201":
          description: Group member added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsistencyGroupMemberEnvelope"
  /groups/{groupID}/network-mappings:
    get:
      tags: [Groups]
      operationId: listDRNetworkMappings
      summary: List network mappings for a group.
      x-required-permission: dr:read
      parameters:
        - $ref: "#/components/parameters/GroupID"
      responses:
        "200":
          description: Network mappings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkMappingListEnvelope"
    post:
      tags: [Groups]
      operationId: createDRNetworkMapping
      summary: Create a production or isolated network mapping.
      x-required-permission: dr:write
      x-outbox:
        topic: datastream.dr.events
        event_type: com.clario360.dr.network_mapping.created
      parameters:
        - $ref: "#/components/parameters/GroupID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNetworkMappingRequest"
      responses:
        "201":
          description: Network mapping created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkMappingEnvelope"
  /groups/{groupID}/recovery-points:
    get:
      tags: [RecoveryPoints]
      operationId: listDRRecoveryPoints
      summary: List recovery points for a group.
      x-required-permission: dr:read
      parameters:
        - $ref: "#/components/parameters/GroupID"
      responses:
        "200":
          description: Recovery points.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryPointListEnvelope"
    post:
      tags: [RecoveryPoints]
      operationId: sealDRRecoveryPoint
      summary: Seal a new immutable recovery point for a consistency group.
      x-required-permission: dr:write
      x-outbox:
        topic: datastream.dr.events
        event_type: com.clario360.dr.recovery_point.sealed
      parameters:
        - $ref: "#/components/parameters/GroupID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SealRecoveryPointRequest"
      responses:
        "201":
          description: Recovery point sealed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryPointEnvelope"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /groups/{groupID}/journal/materialize:
    post:
      tags: [Journal, Failover]
      operationId: materializeDRJournalRecoveryPoint
      summary: Replay the CDP journal to a point in time and seal it as a recovery point.
      x-required-permission: dr:failover
      parameters:
        - $ref: "#/components/parameters/GroupID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterializeJournalRecoveryPointRequest"
      responses:
        "201":
          description: Journal-backed recovery point sealed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryPointEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /recovery-tiers:
    get:
      tags: [RecoveryTier]
      operationId: listDRRecoveryTiers
      summary: List built-in recovery objective tiers.
      x-required-permission: dr:read
      responses:
        "200":
          description: Built-in recovery tiers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryTierListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /recovery-tiers/coverage:
    get:
      tags: [RecoveryTier]
      operationId: getDRRecoveryTierCoverage
      summary: Summarize protected-site objective fit across the recovery-tier catalog.
      x-required-permission: dr:read
      responses:
        "200":
          description: Recovery-tier coverage summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /recovery-tiers/sites/{site}/recommend:
    get:
      tags: [RecoveryTier]
      operationId: recommendDRRecoveryTierForSite
      summary: Recommend a recovery tier for one protected site from configured objectives.
      x-required-permission: dr:read
      parameters:
        - name: site
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Site recovery-tier recommendation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/RecoveryTierSiteRecommendation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /recovery-tiers/{tier}:
    get:
      tags: [RecoveryTier]
      operationId: getDRRecoveryTier
      summary: Get one built-in recovery objective tier.
      x-required-permission: dr:read
      parameters:
        - $ref: "#/components/parameters/RecoveryTier"
      responses:
        "200":
          description: Recovery tier profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryTierProfileEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /recovery-tiers/recommend:
    post:
      tags: [RecoveryTier]
      operationId: recommendDRRecoveryTier
      summary: Recommend the lowest recovery tier that satisfies requested objectives.
      x-required-permission: dr:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecoveryTierRecommendationRequest"
      responses:
        "200":
          description: Recommended recovery tier.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryTierRecommendationEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /recovery-points/{recoveryPointID}:
    get:
      tags: [RecoveryPoints]
      operationId: getDRRecoveryPoint
      summary: Get a recovery point.
      x-required-permission: dr:read
      parameters:
        - $ref: "#/components/parameters/RecoveryPointID"
      responses:
        "200":
          description: Recovery point.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryPointEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /recovery-points/{recoveryPointID}/validate:
    post:
      tags: [RecoveryPoints]
      operationId: validateDRRecoveryPoint
      summary: Validate a sealed recovery point and reconcile WORM legal holds.
      x-required-permission: dr:write
      x-outbox:
        topic: datastream.dr.events
        event_type: com.clario360.dr.recovery_point.validated
      parameters:
        - $ref: "#/components/parameters/RecoveryPointID"
      responses:
        "200":
          description: Recovery point validation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryPointEnvelope"
        "409":
          $ref: "#/components/responses/Conflict"
  /recovery-points/{id}/instant-recovery:
    post:
      tags: [InstantRecovery]
      operationId: startDRInstantRecovery
      summary: Start an instant recovery COW session over a sealed recovery point.
      x-required-permission: dr:failover
      x-outbox:
        topic: datastream.dr.events
        event_type: com.clario360.datastream.dr.instant.started
      parameters:
        - $ref: "#/components/parameters/InstantRecoveryPointID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartInstantRecoveryRequest"
      responses:
        "201":
          description: Instant recovery session started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstantSessionEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/BadRequest"
  /instant-sessions/{id}:
    get:
      tags: [InstantRecovery]
      operationId: getDRInstantSession
      summary: Get an instant recovery session and hydration progress.
      x-required-permission: dr:read
      parameters:
        - $ref: "#/components/parameters/InstantSessionID"
      responses:
        "200":
          description: Instant recovery progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstantProgressEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
  /instant-sessions/{id}/chunks/{index}:
    get:
      tags: [InstantRecovery]
      operationId: readDRInstantChunk
      summary: Read raw bytes from an instant recovery COW chunk.
      x-required-permission: dr:read
      parameters:
