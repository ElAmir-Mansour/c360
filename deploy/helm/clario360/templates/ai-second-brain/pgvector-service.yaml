{{- if and .Values.aiSecondBrain.enabled .Values.aiSecondBrain.pgvector.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clario360.componentName" (dict "root" . "component" "ai-second-brain-db") }}
  namespace: {{ include "clario360.namespace" . }}
  labels:
    {{- include "clario360.componentLabels" (dict "root" . "component" "ai-second-brain-db") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: {{ int .Values.aiSecondBrain.pgvector.port }}
      targetPort: postgres
      protocol: TCP
  selector:
    {{- include "clario360.componentSelectorLabels" (dict "root" . "component" "ai-second-brain-db") | nindent 4 }}
{{- end }}
