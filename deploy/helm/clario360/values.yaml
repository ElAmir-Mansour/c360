  metricsPort: 9097
  mtlsPort: 8098
  databaseName: dr_db
  existingSecret: ""
  logLevel: debug
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: false
    minAvailable: 1
  service: {}
  serviceAccount:
    create: true
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  terminationGracePeriodSeconds: 30
  kafkaGroupId: "clario-dr-service"
  dbMinConns: "2"
  dbMaxConns: "10"
  recoveryRetention: "168h"
  legalHoldCount: "3"
  enrollToken:
    keyName: "dr-enrollment-jwt"
    privateKeyPath: ""
    privateKeyPEM: ""
    privateJWK: ""
    allowEphemeral: false
  recoveryDriver:
    type: "verify"
    ensureCommand: []
    teardownCommand: []
    timeout: "10m"
  integrations:
    encKey: ""
  minio:
    region: "us-east-1"
    wormBucket: "dr-recovery-points"
  vault:
    addr: ""
    authMethod: "token"
    token: ""
    appRoleRoleId: ""
    appRoleSecretId: ""
    transitPath: "transit/"
    namespace: ""
  pki:
    rootMount: "pki-dr-root"
    intermediatePrefix: "pki-dr-intermediate-"
    leafTtl: "8760h"
    intermediateTtl: "43800h"
    roleName: "dr-agent-leaf"
    domainSuffix: "agents.dr.clario360.local"
    leafOverlap: "5m"
  mtls:
    enabled: false
    listenAddr: ":8098"
    existingSecret: ""
    caBundlePath: "/etc/clario-dr/mtls/ca.crt"
    serverCertPath: "/etc/clario-dr/mtls/tls.crt"
    serverKeyPath: "/etc/clario-dr/mtls/tls.key"
    crlRefresh: "1m"
  rpoMonitor:
    interval: "30s"
    leaderTtl: "30s"
    leaderRenew: "10s"
  failoverDriver:
    enabled: false
    interval: "2s"
    leaderTtl: "30s"
    leaderRenew: "10s"
    unsafeSingleNode: false
  serviceMonitor:
    enabled: true
  networkPolicy:
    agentIngressCidrs: []
  config: {}
  extraEnv: []

# -------------------------------------------------------------------------
# Automation Service (trigger -> rules -> runbook engine)
# -------------------------------------------------------------------------
automationService:
  enabled: true
  replicaCount: 2
  revisionHistoryLimit: 5
  image:
    repository: clario360/automation-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  port: 8098
  metricsPort: 9098
  logLevel: debug
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    # Scaling out is safe: the run-driver, gate sweeper, and cron schedule loops
    # are Redis leader-elected singletons, so only the leader drives them while
    # every replica serves the HTTP API and the event/threshold bus consumers.
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: false
    minAvailable: 1
  service: {}
  serviceAccount:
    create: true
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  podLabels: {}
  terminationGracePeriodSeconds: 30
  kafkaGroupId: "automation-service"
  # The action executors reach workflow / dr_runbook / http_call targets through
  # the in-cluster API gateway; leave blank to default to the release gateway.
  gatewayUrl: ""
  workflowGatewayUrl: ""
  drGatewayUrl: ""
  config: {}
  extraEnv: []

