        tier:
          type: string
          enum: [bronze, silver, gold, platinum]
        strategy:
          type: string
          enum: [backup_restore, pilot_light, warm_standby, active_active]
        rto_objective_seconds:
          type: integer
          minimum: 1
        rpo_objective_seconds:
          type: integer
          minimum: 1
        validation_cadence_seconds:
          type: integer
          minimum: 1
        requires_cyber_vault:
          type: boolean
        requires_clean_room:
          type: boolean
        capabilities:
          type: array
          items:
            type: string
        notes:
          type: array
          items:
            type: string
