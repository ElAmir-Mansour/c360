<h2 style="color:#06352F; margin:0 0 16px 0; font-size:20px;">New Task Assigned</h2>
<div style="background-color:#FDFFF6; padding:16px; border:1px solid #D1D8D5; border-left:4px solid #ABB705; border-radius:4px; margin-bottom:20px;">
  <p style="margin:0;">{{.body}}</p>
</div>
{{if .sla_deadline}}
<p style="color:#6C7874; font-size:14px;"><strong>Due:</strong> {{.sla_deadline | formatDate}}</p>
{{end}}
{{if .action_url}}
<p style="text-align:center; margin:24px 0 0 0;">
  <a href="{{.action_url}}" style="display:inline-block; background-color:#005E5E; color:#ffffff; padding:12px 24px; text-decoration:none; border-radius:4px; font-weight:600; font-size:14px;">View Task</a>
</p>
{{end}}
