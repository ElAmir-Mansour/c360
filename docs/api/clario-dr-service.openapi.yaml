        - vault_lock_enabled
        - encryption_enabled
        - customer_managed_key
        - approval
        - retention
        - isolation
        - last_restore_test_passed
        - break_glass_enabled
        - break_glass_mfa
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        provider:
          type: string
          enum: [generic, aws_backup, azure_backup, gcp_backup_dr, s3_object_lock]
        primary_region:
          type: string
        replica_regions:
          type: array
          items:
            type: string
        immutability_enabled:
          type: boolean
        vault_lock_enabled:
          type: boolean
        encryption_enabled:
          type: boolean
        customer_managed_key:
          type: boolean
        approval:
          $ref: "#/components/schemas/CyberVaultApprovalPolicy"
        retention:
          $ref: "#/components/schemas/CyberVaultRetentionPolicy"
        isolation:
          $ref: "#/components/schemas/CyberVaultIsolationPolicy"
        last_restore_test_at:
          $ref: "#/components/schemas/Timestamp"
        last_restore_test_passed:
          type: boolean
        restore_test_window_days:
          type: integer
          minimum: 0
        break_glass_enabled:
          type: boolean
        break_glass_mfa:
          type: boolean
        break_glass_last_tested_at:
          $ref: "#/components/schemas/Timestamp"
        break_glass_test_window_days:
          type: integer
          minimum: 0
