{{- if .Values.aiSecondBrain.enabled }}
{{- if not .Values.aiSecondBrain.secret.existingSecret }}
{{/*
  AI Second Brain secrets — existingSecret pattern (mirrors secrets.yaml).
  Holds the generation key (ANTHROPIC_API_KEY), the pgvector DSN
  (AI_DATABASE_URL), the corpus-pull token (LEX_API_TOKEN) and, when the bundled
  pgvector is used, its password (PGVECTOR_PASSWORD). AI_DATABASE_URL is derived
  from the bundled pgvector service when not given explicitly.
*/}}
{{- $ai := .Values.aiSecondBrain -}}
{{- $dbUrl := $ai.secret.databaseUrl -}}
{{- if and (not $dbUrl) $ai.pgvector.enabled -}}
  {{- $pv := $ai.pgvector -}}
  {{- $svc := include "clario360.componentName" (dict "root" . "component" "ai-second-brain-db") -}}
  {{- $pw := required "aiSecondBrain.pgvector.password is required when pgvector.enabled and neither secret.databaseUrl nor pgvector.existingSecret is set" $pv.password -}}
  {{- $dbUrl = printf "postgresql://%s:%s@%s:%v/%s" $pv.username $pw $svc (int $pv.port) $pv.database -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clario360.componentName" (dict "root" . "component" "ai-second-brain") }}-secret
  namespace: {{ include "clario360.namespace" . }}
  labels:
    {{- include "clario360.componentLabels" (dict "root" . "component" "ai-second-brain") | nindent 4 }}
type: Opaque
data:
  ANTHROPIC_API_KEY: {{ $ai.secret.anthropicApiKey | default "" | b64enc | quote }}
  LEX_API_TOKEN: {{ $ai.secret.lexApiToken | default "" | b64enc | quote }}
  AI_DATABASE_URL: {{ $dbUrl | default "" | b64enc | quote }}
  {{- if and $ai.pgvector.enabled (not $ai.pgvector.existingSecret) }}
  PGVECTOR_PASSWORD: {{ required "aiSecondBrain.pgvector.password is required when pgvector.enabled and pgvector.existingSecret is not set" $ai.pgvector.password | b64enc | quote }}
  {{- end }}
{{- end }}
{{- end }}
