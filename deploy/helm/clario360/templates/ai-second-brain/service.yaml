{{- if .Values.aiSecondBrain.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clario360.componentName" (dict "root" . "component" "ai-second-brain") }}
  namespace: {{ include "clario360.namespace" . }}
  labels:
    {{- include "clario360.componentLabels" (dict "root" . "component" "ai-second-brain") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ int .Values.aiSecondBrain.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "clario360.componentSelectorLabels" (dict "root" . "component" "ai-second-brain") | nindent 4 }}
{{- end }}
