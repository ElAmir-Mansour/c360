{{- if .Values.automationService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "clario360.componentName" (dict "root" . "component" "automation-service") }}
  namespace: {{ include "clario360.namespace" . }}
  labels:
    {{- include "clario360.componentLabels" (dict "root" . "component" "automation-service") | nindent 4 }}
spec:
  replicas: {{ .Values.automationService.replicaCount | default 2 }}
  revisionHistoryLimit: {{ .Values.automationService.revisionHistoryLimit | default 5 }}
  selector:
    matchLabels:
      {{- include "clario360.componentSelectorLabels" (dict "root" . "component" "automation-service") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/automation-service/configmap.yaml") . | sha256sum }}
        {{- include "clario360.prometheusAnnotations" (dict "metricsPort" "9098") | nindent 8 }}
        {{- with .Values.automationService.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "clario360.componentSelectorLabels" (dict "root" . "component" "automation-service") | nindent 8 }}
        {{- with .Values.automationService.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "clario360.serviceAccountName" (dict "root" . "component" "automation-service" "svcConfig" .Values.automationService) }}
      securityContext:
        {{- include "clario360.podSecurityContext" . | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.automationService.terminationGracePeriodSeconds | default 30 }}
      containers:
        - name: automation-service
          image: {{ include "clario360.image" (dict "imageConfig" .Values.automationService.image "root" . "defaultRepo" "clario360/automation-service") }}
          imagePullPolicy: {{ .Values.automationService.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            {{- include "clario360.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8098
              protocol: TCP
            - name: admin
              containerPort: 9098
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "clario360.sharedConfigMapName" . }}
            - configMapRef:
                name: {{ include "clario360.componentName" (dict "root" . "component" "automation-service") }}-config
          env:
            - name: AUTO_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "clario360.fullname" . }}-database-credentials
                  key: AUTOMATION_DB_URL
            - name: AUTO_KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "clario360.sharedConfigMapName" . }}
                  key: KAFKA_BROKERS
            - name: AUTH_RSA_PUBLIC_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: {{ include "clario360.fullname" . }}-jwt-keys
                  key: AUTH_RSA_PUBLIC_KEY_PEM
            - name: AUTH_RSA_PRIVATE_KEY_PEM
              valueFrom:
                secretKeyRef:
                  name: {{ include "clario360.fullname" . }}-jwt-keys
                  key: AUTH_RSA_PRIVATE_KEY_PEM
            - name: OTEL_SERVICE_NAME
              value: "automation-service"
            {{- with .Values.automationService.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- include "clario360.healthProbes" (dict "portName" "http" "healthPath" "/healthz" "readyPath" "/readyz") | nindent 10 }}
          resources:
            {{- toYaml .Values.automationService.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "clario360.componentSelectorLabels" (dict "root" . "component" "automation-service") | nindent 14 }}
      {{- with .Values.automationService.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.automationService.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.automationService.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
