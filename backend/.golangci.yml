version: "2"
run:
  tests: true
linters:
  enable:
    - bodyclose
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - nakedret
    - noctx
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - wrapcheck
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write
    exhaustive:
      default-signifies-exhaustive: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
    gosec:
      excludes:
        - G104
      config:
        G306: "0600"
    nakedret:
      max-func-lines: 30
    revive:
      rules:
        - name: exported
          disabled: false
        - name: var-naming
          disabled: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - bodyclose
          - errcheck
          - gocritic
          - gosec
          - noctx
          - wrapcheck
        path: _test\.go
      - linters:
          - golint
          - staticcheck
        path: generated
      - linters:
          - wrapcheck
        path: cmd/.*/main\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/clario360
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
