lexService:
  replicas: 2
  logLevel: warn
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPU: 65
    targetMemory: 75
  pdb:
    enabled: true
    minAvailable: 1
  config:
    rateLimitPerMinute: 600
    expiryMonitorInterval: 1h
    complianceMonitorInterval: 6h
    renewalReminderInterval: 6h
    orgJurisdiction: "Saudi Arabia"
  # REQUIRED at install: an operator-managed Secret containing the trusted CA
  # bundle used to verify Watheeq Delegation-of-Authority evidence.
  approvalAuthority:
    trustedRootsSecret:
      name: ""
      key: LEX_APPROVAL_AUTHORITY_TRUSTED_ROOTS_PEM
    revocationEnabled: true
    revokedSerials: ""
  # WatheeqTech Reference Library — PRODUCTION stores the corpus in the platform
  # file-service / MinIO (design §2.3 Option A), NOT a mounted corpus volume.
  # Prerequisites (see WatheeqTech_Library_Runbook.md §2.1 + §11):
  #   1. fileService.enabled (default true) ⇒ LEX_FILE_SERVICE_URL is derived to
  #      the in-cluster file-service; or set referenceLibrary.fileServiceUrl.
  #   2. The RS256 PRIVATE key is present in the jwt-keys secret so lex can mint
  #      the library-tenant JWT. Rendered automatically in this mode.
  #   3. libraryTenantId = the canonical library tenant UUID. REQUIRED — the Helm
  #      render FAILS LOUDLY if it is empty (never silently ships a 502 default).
  #      Provide it at install and NEVER commit it here:
  #        --set lexService.referenceLibrary.libraryTenantId=<uuid>
  #      (or via a private, uncommitted prod overrides file).
  #   4. The 33 PDFs uploaded to the MinIO bucket via
  #      `reference-library-seed --byte-source=file-service` (Runbook §4).
  referenceLibrary:
    storageMode: file-service
    libraryTenantId: ""   # REQUIRED at install; empty ⇒ render fails loud
    # fileServiceUrl: ""  # optional external override; else derived in-cluster

visusService:
  replicas: 2
  logLevel: warn
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
