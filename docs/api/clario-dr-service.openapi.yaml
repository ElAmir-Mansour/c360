          description: Failover run cancelled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailoverRunEnvelope"
        "409":
          $ref: "#/components/responses/Conflict"
  /failover-runs/{runID}/steps:
    get:
      tags: [Failover]
      operationId: listDRFailoverSteps
      summary: List durable failover step records.
      x-required-permission: dr:read
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: Failover steps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FailoverStepListEnvelope"
  /failover-runs/{runID}/attestation:
    get:
      tags: [Failover]
      operationId: getDRFailoverAttestation
      summary: Get sealed attestation metadata for a completed run.
      x-required-permission: dr:read
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: Attestation metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttestationEnvelope"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tenantContext:
      type: apiKey
      in: header
      name: X-Tenant-ID
      description: Optional fallback when tenant context is not present in the JWT.
    agentMutualTLS:
      type: mutualTLS
  parameters:
    AgentID:
      name: agentID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GroupID:
      name: groupID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecoveryPointID:
      name: recoveryPointID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RecoveryTier:
      name: tier
      in: path
      required: true
      schema:
        type: string
        enum: [bronze, silver, gold, platinum]
    InstantRecoveryPointID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InstantSessionID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChunkIndex:
      name: index
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
    RunID:
      name: runID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FailoverID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SiteID:
      name: siteID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StreamID:
      name: streamID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BookmarkID:
      name: bookmarkID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FailbackRunID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunbookID:
      name: runbookID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskAction:
      name: taskAction
      in: path
      required: true
