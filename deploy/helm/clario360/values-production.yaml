      memory: 2Gi
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPU: 65
    targetMemory: 75
  pdb:
    enabled: true
    minAvailable: 1
  config:
    suiteTimeout: 10s
    suiteMaxRetries: 3
    circuitBreakerThreshold: 5
    circuitBreakerReset: 60s
    schedulerInterval: 60s
    serviceTokenTtl: 10m

licenseService:
  replicaCount: 2
  logLevel: warn
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 65
    targetMemoryUtilizationPercentage: 75
  pdb:
    enabled: true
    minAvailable: 1

clarioDrService:
  replicaCount: 3
  logLevel: warn
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 8
    targetCPUUtilizationPercentage: 65
    targetMemoryUtilizationPercentage: 75
  pdb:
    enabled: true
    minAvailable: 2
  minio:
    region: "af-west-1"
    wormBucket: "dr-recovery-points"
  enrollToken:
    allowEphemeral: false
  recoveryDriver:
    type: "command"
    ensureCommand:
      - "/opt/clario/dr-provisioner"
      - "ensure"
    teardownCommand:
      - "/opt/clario/dr-provisioner"
      - "teardown"
    timeout: "15m"
  vault:
    addr: "https://vault.clario360.com"
    authMethod: "approle"
    transitPath: "transit/"
  mtls:
    listenAddr: ":8098"
    crlRefresh: "30s"
  rpoMonitor:
    interval: "15s"
    leaderTtl: "30s"
    leaderRenew: "10s"
  failoverDriver:
    interval: "2s"
    leaderTtl: "30s"
    leaderRenew: "10s"
    unsafeSingleNode: false
  networkPolicy:
    agentIngressCidrs: []

