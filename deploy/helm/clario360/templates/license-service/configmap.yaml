{{- if .Values.licenseService.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clario360.componentName" (dict "root" . "component" "license-service") }}-config
  namespace: {{ include "clario360.namespace" . }}
  labels:
    {{- include "clario360.componentLabels" (dict "root" . "component" "license-service") | nindent 4 }}
data:
  LICENSE_HTTP_PORT: "8096"
  LICENSE_ADMIN_PORT: "9096"
  LICENSE_KAFKA_GROUP_ID: {{ .Values.licenseService.kafkaGroupId | default "license-service" | quote }}
  {{- with .Values.licenseService.config }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
