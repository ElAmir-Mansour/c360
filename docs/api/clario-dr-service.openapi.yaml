          type: boolean
        restore_approvers:
          type: integer
          minimum: 0
        require_destructive_approval:
          type: boolean
        destructive_approvers:
          type: integer
          minimum: 0
        separation_of_duties:
          type: boolean
    CyberVaultRetentionPolicy:
