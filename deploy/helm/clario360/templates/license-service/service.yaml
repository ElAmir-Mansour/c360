{{- if .Values.licenseService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "clario360.componentName" (dict "root" . "component" "license-service") }}
  namespace: {{ include "clario360.namespace" . }}
  labels:
    {{- include "clario360.componentLabels" (dict "root" . "component" "license-service") | nindent 4 }}
  {{- with ((.Values.licenseService).service).annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ dig "service" "type" "ClusterIP" .Values.licenseService }}
  ports:
    - name: http
      port: 8096
      targetPort: http
      protocol: TCP
    - name: admin
      port: 9096
      targetPort: admin
      protocol: TCP
  selector:
    {{- include "clario360.componentSelectorLabels" (dict "root" . "component" "license-service") | nindent 4 }}
{{- end }}
