# -------------------------------------------------------------------------
# Lex Service (Legal Operations)
# -------------------------------------------------------------------------
lexService:
  enabled: true
  replicas: 1
  image:
    repository: clario360/lex-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  port: 8087
  metricsPort: 9087
  logLevel: debug
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPU: 70
    targetMemory: 80
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: false
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  env: []
  kafkaGroupId: "lex-service"
  kafkaTopic: "enterprise.lex.events"
  rateLimitPerMinute: "300"
  expiryMonitorInterval: "1h"
  complianceMonitorInterval: "6h"
  orgJurisdiction: "Saudi Arabia"
  # File-service origin used by the request-authorized attachment proxy. Empty
  # derives the in-cluster file-service when fileService.enabled. Set an
  # explicit URL only when file-service is deployed externally.
  requestFileServiceUrl: ""
  # Delegation-of-Authority decisions are cryptographically verified in every
  # protected profile. The referenced Secret must contain a PEM CA bundle.
  approvalAuthority:
    trustedRootsSecret:
      name: ""
      key: LEX_APPROVAL_AUTHORITY_TRUSTED_ROOTS_PEM
    revocationEnabled: false
    revokedSerials: ""
  # WatheeqTech Reference Library + Second Brain wiring (Workstream D).
  referenceLibrary:
    # Byte-storage backend for /reference-library/{id}/download:
    #   volume       — stream PDF bytes from a mounted read-only corpus dir
    #                  (design §2.4). DEFAULT: an out-of-the-box `helm install`
    #                  needs no object store. Downloads 404 until the corpus is
    #                  staged, but lex boots and browse/search work.
    #   file-service — PRODUCTION (design §2.3 Option A): fetch bytes from the
    #                  platform file-service / MinIO as the canonical library
    #                  tenant. lex MINTS that tenant's JWT, so this mode renders
    #                  the RS256 PRIVATE key + LEX_FILE_SERVICE_URL +
    #                  LEX_REFERENCE_LIBRARY_TENANT_ID and mounts NO volume.
    #                  See values-production.yaml + Runbook §2.1.
    storageMode: volume
    # Read-only corpus dir (volume mode). Rendered into LEX_REFERENCE_LIBRARY_DIR.
    dir: "/var/lib/clario360/reference-library"
    # OPTIONAL (volume mode): how the 95 MB corpus is mounted at `dir`. Off by
    # default so the deployment is unchanged unless you provision it. Set `volume`
    # to a raw Pod volume source (persistentVolumeClaim / hostPath / nfs / csi) —
    # it is mounted read-only at `dir`. See WatheeqTech_Library_Runbook.md §2.
    volume: {}
    # file-service mode only. libraryTenantId is REQUIRED when
    # storageMode=file-service — the render FAILS LOUDLY if empty (never a silent
    # 502). It is the canonical tenant that owns the corpus objects in MinIO.
    libraryTenantId: ""
    # OPTIONAL (file-service mode): file-service origin. Empty ⇒ derived from the
    # in-cluster file-service component when fileService.enabled; set this to
    # point at an external file-service.
    fileServiceUrl: ""
    # LEX_AI_SERVICE_URL is derived automatically from aiSecondBrain (below) when
    # that component is enabled; set this to override with an external URL.
    aiServiceUrl: ""

# -------------------------------------------------------------------------
# AI Second Brain (ai/second-brain — FastAPI RAG over the WatheeqTech corpus)
# The platform's first FastAPI AI runtime. Internal-only: reached via
# lex-service's /reference-library/search|ask proxy, NOT the gateway. Disabled
# by default — it is heavy (pgvector + a ~2 GB embedding model + tesseract) and
# only Watheeq tenants use it. See WatheeqTech_Library_Runbook.md §5.
# -------------------------------------------------------------------------
aiSecondBrain:
  enabled: false
  replicas: 1
  image:
    repository: clario360/ai-second-brain
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  port: 8000
  # First /ingest downloads the embedding model (~2 GB incl. torch) into the
  # models volume — size requests for that + inference, not idle.
  resources:
    requests:
      cpu: "500m"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  # Non-root; the Python service writes the HF model cache to /models (mounted
  # writable via fsGroup) and pyc is disabled, so the root fs stays read-only.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 65534
    capabilities:
      drop:
        - ALL
  # Persist the downloaded embedding model across restarts. When false an
  # emptyDir is used and the ~2 GB model re-downloads on every pod start.
  modelCache:
    persistent: true
    size: 5Gi
    storageClass: ""
  config:
    AI_LLM_MODEL: "claude-opus-4-8"
    AI_LLM_MAX_TOKENS: "8000"
    AI_EMBEDDING_MODEL: "intfloat/multilingual-e5-large"
    AI_EMBEDDING_DIM: "1024"
    OCR_ENABLED: "true"
    OCR_LANG: "ara"
    # Corpus source for /ingest (Option A — pull the catalog+bytes from lex via
    # the gateway). Derived from lex-service when blank; override to point
    # elsewhere. A blank LEX_API_URL falls back to a mounted local corpus.
    LEX_API_URL: ""
    LEX_TENANT_ID: ""
    PYTHONDONTWRITEBYTECODE: "1"
    HF_HOME: "/models"
  # Anthropic key + AI_DATABASE_URL land in a Secret (existingSecret pattern).
  secret:
    existingSecret: ""
    anthropicApiKey: ""   # blank => /ask returns 503; /search still works
    # AI_DATABASE_URL — leave blank to use the bundled pgvector below.
    databaseUrl: ""
    lexApiToken: ""
  pdb:
    enabled: false
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []
  # OPTIONAL local corpus for the no-LEX ingestion path. Off by default (prefer
  # Option A: LEX_API_URL pulls the corpus from lex). Set `volume` to a raw Pod
  # volume source to mount the 95 MB corpus read-only at /corpus.
  corpus:
    volume: {}
  # Bundled pgvector Postgres (StatefulSet). Disable to bring your own via
  # aiSecondBrain.secret.databaseUrl / existingSecret.
  pgvector:
    enabled: true
    image:
      repository: pgvector/pgvector
      tag: "pg16"
      pullPolicy: IfNotPresent
    port: 5432
    database: second_brain
    username: second_brain
    password: ""   # REQUIRED when pgvector.enabled unless existingSecret set
    existingSecret: ""
    storage:
      size: 10Gi
      storageClass: ""
    resources:
      requests:
        cpu: "250m"
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

