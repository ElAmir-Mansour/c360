    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'license_(.*)'
        target_label: __name__
        replacement: 'clario360_license_${1}'
      - source_labels: [__name__]
        regex: 'db_(.*)'
        target_label: __name__
        replacement: 'clario360_db_${1}'
      - source_labels: [__name__]
        regex: 'kafka_(.*)'
        target_label: __name__
