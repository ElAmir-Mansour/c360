    <rect x="0" y="0" width="80" height="80" fill="#fff"/>
    <circle cx="40" cy="40" r="15" fill="#000"/>
    <rect x="0" y="26" width="80" height="6" fill="#000"/>
    <rect x="0" y="48" width="80" height="6" fill="#000"/>
  </mask>
  <circle cx="40" cy="40" r="36" fill="#ABB705" mask="url(#f)"/>
</svg>
