<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" role="img" aria-label="Clario360">
  <title>Clario360</title>
  <!-- App icon: leaf-green rounded square with the white aperture rings. -->
  <rect width="180" height="180" rx="40" fill="#ABB705"/>
  <g transform="translate(28 28) scale(1.55)">
    <mask id="a" maskUnits="userSpaceOnUse" x="0" y="0" width="80" height="80">
      <rect x="0" y="0" width="80" height="80" fill="#fff"/>
      <circle cx="40" cy="40" r="13" fill="#000"/>
      <rect x="0" y="20.5" width="80" height="3" fill="#000"/>
      <rect x="0" y="32.5" width="80" height="3" fill="#000"/>
      <rect x="0" y="44.5" width="80" height="3" fill="#000"/>
      <rect x="0" y="56.5" width="80" height="3" fill="#000"/>
    </mask>
    <circle cx="40" cy="40" r="34" fill="#FDFFF6" mask="url(#a)"/>
  </g>
</svg>
