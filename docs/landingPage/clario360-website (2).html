<style>
/* ============================================================
   CLARIO360 — DESIGN TOKENS
   Derived from the product's own design system (--ds-* tokens):
   navy #0033A1 primary · gold accent · teal (DataStream) · ink
   ============================================================ */
:root{
  /* Brand */
  --navy-950:#040A2E;
  --navy-900:#071449;
  --navy-800:#0A1C66;
  --navy-700:#0B2585;
  --navy-600:#0033A1;   /* PRIMARY — the sovereign blue from tokens.css */
  --navy-500:#1D4FD6;
  --navy-400:#4F7BF0;
  --navy-300:#8FAEF8;
  --navy-200:#C3D4FC;
  --navy-100:#E4ECFE;
  --navy-50:#F2F6FF;

  --ink:#0A0E27;        /* dark sections */
  --ink-soft:#10173A;
  --ink-line:rgba(255,255,255,.10);

  --gold-600:#A9863F;
  --gold-500:#C9A65A;   /* accent — the sovereign/royal note */
  --gold-400:#DCC07F;
  --gold-100:#F4EBD4;

  --teal-700:#0A4F58;
  --teal-600:#0E6E7A;   /* DataStream family */
  --teal-400:#39A6B2;
  --teal-100:#D8EEF1;

  --paper:#FBFAF7;      /* warm-cool off white */
  --paper-2:#F4F2EC;
  --card:#FFFFFF;
  --line:#E7E3DA;
  --line-2:#D8D3C7;

  --text:#15182B;
  --text-2:#4A4F66;
  --text-3:#7A8099;
  --text-inv:#F3F5FB;
  --text-inv-2:#A9B4D6;

  --ok:#16A34A;
  --warn:#D97706;
  --crit:#DC2626;

  /* Type */
  --sans:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --display:"Fraunces","Iowan Old Style","Palatino Linotype",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono","JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --arabic:"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,sans-serif;

  /* Scale / motion */
  --maxw:1200px;
  --r-sm:8px; --r:14px; --r-lg:22px; --r-xl:30px;
  --shadow-1:0 1px 2px rgba(10,14,39,.06),0 4px 14px rgba(10,14,39,.05);
  --shadow-2:0 10px 30px rgba(10,14,39,.10),0 2px 6px rgba(10,14,39,.06);
  --shadow-navy:0 18px 50px rgba(0,51,161,.28);
  --ease:cubic-bezier(.22,.61,.36,1);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--text);
  font-family:var(--sans);font-size:16px;line-height:1.62;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
/* Global safety: any inline SVG icon defaults to text-size; specific rules below scale up. */
svg{width:1em;height:1em;flex:none}
.more svg{width:16px;height:16px}
::selection{background:var(--navy-600);color:#fff}

/* ---------- Accessibility ---------- */
.skip-link{
  position:fixed;top:-60px;left:16px;z-index:300;
  background:var(--navy-600);color:#fff;padding:12px 20px;border-radius:8px;
  font-family:var(--sans);font-weight:600;font-size:.9rem;transition:top .2s var(--ease);
}
.skip-link:focus{top:16px;outline:3px solid var(--gold-400);outline-offset:2px}
/* Visible keyboard focus everywhere, without affecting mouse users */
:focus-visible{outline:3px solid var(--navy-500);outline-offset:2px;border-radius:4px}
.nav.dark :focus-visible,.hero :focus-visible,.page-hero :focus-visible,.footer :focus-visible,.stats-band :focus-visible{outline-color:var(--gold-400)}
.btn:focus-visible{outline-offset:3px}
/* Keep hover affordances but make interactive spans behave for AT */
[role="button"],[tabindex="0"]{cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#main:focus{outline:none}
#main{display:block}

h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.08;letter-spacing:-.02em;margin:0;color:var(--text)}
h1{font-size:clamp(2.5rem,6vw,4.5rem)}
h2{font-size:clamp(2rem,4.4vw,3.25rem)}
h3{font-size:clamp(1.35rem,2.4vw,1.85rem)}
h4{font-size:1.18rem;letter-spacing:-.01em}
p{margin:0 0 1rem}
.lede{font-size:clamp(1.12rem,1.7vw,1.4rem);line-height:1.55;color:var(--text-2);font-weight:400}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}
.section{padding:clamp(64px,9vw,128px) 0}
.section-tight{padding:clamp(48px,6vw,84px) 0}

/* Eyebrow — encodes section meaning, tracked caps */
.eyebrow{
  display:inline-flex;align-items:center;gap:9px;
  font-family:var(--mono);font-size:.72rem;font-weight:500;
  letter-spacing:.24em;text-transform:uppercase;color:var(--navy-600);
  margin-bottom:18px;
}
.eyebrow::before{content:"";width:22px;height:1.5px;background:var(--gold-500)}
.eyebrow.on-dark{color:var(--gold-400)}
.eyebrow.on-dark::before{background:var(--gold-500)}

.bilingual{font-family:var(--arabic);direction:rtl;unicode-bidi:isolate}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:9px;
  font-family:var(--sans);font-weight:600;font-size:.95rem;
  padding:13px 24px;border-radius:var(--r-sm);border:1.5px solid transparent;
  cursor:pointer;transition:all .25s var(--ease);white-space:nowrap;
}
.btn svg{width:17px;height:17px}
.btn-primary{background:var(--navy-600);color:#fff;box-shadow:var(--shadow-navy)}
.btn-primary:hover{background:var(--navy-700);transform:translateY(-2px);box-shadow:0 22px 56px rgba(0,51,161,.36)}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--line-2)}
.btn-ghost:hover{border-color:var(--navy-600);color:var(--navy-600);background:var(--navy-50)}
.btn-gold{background:var(--gold-500);color:var(--ink)}
.btn-gold:hover{background:var(--gold-400);transform:translateY(-2px)}
.btn-ondark{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.22);backdrop-filter:blur(8px)}
.btn-ondark:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4)}
.btn-lg{padding:16px 30px;font-size:1rem}
.linkarrow{font-weight:600;color:var(--navy-600);display:inline-flex;align-items:center;gap:7px;transition:gap .2s var(--ease)}
.linkarrow:hover{gap:12px}
.linkarrow svg{width:16px;height:16px;transition:transform .2s var(--ease)}

/* ============================================================
   NAVBAR
   ============================================================ */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  transition:all .3s var(--ease);
}
.nav-inner{
  max-width:var(--maxw);margin:0 auto;padding:0 28px;
  height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px;
}
.nav.scrolled{background:rgba(251,250,247,.86);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
.nav.dark{}
.nav.dark .nav-link,.nav.dark .logo-text{color:var(--text-inv)}
.nav.dark.scrolled{background:rgba(10,14,39,.78);border-bottom:1px solid var(--ink-line)}
.nav.dark.scrolled .nav-link,.nav.dark.scrolled .logo-text{color:var(--text-inv)}

.logo{display:flex;align-items:center;gap:11px;cursor:pointer}
.logo-mark{width:34px;height:34px;flex:none}
.logo-text{font-family:var(--display);font-weight:600;font-size:1.32rem;letter-spacing:-.02em;color:var(--text)}
.logo-text b{color:var(--navy-600)}
.nav.dark .logo-text b{color:var(--gold-400)}

.nav-links{display:flex;align-items:center;gap:4px}
.nav-link{
  position:relative;font-size:.92rem;font-weight:500;color:var(--text-2);
  padding:9px 14px;border-radius:8px;cursor:pointer;transition:all .2s;
  display:inline-flex;align-items:center;gap:6px;
}
.nav-link:hover{color:var(--navy-600);background:rgba(0,51,161,.06)}
.nav-link.active{color:var(--navy-600)}
.nav-link .chev{width:13px;height:13px;opacity:.6;transition:transform .25s}
.has-mega:hover .chev,.has-mega.mega-open .chev,.has-mega:focus-within .chev{transform:rotate(180deg)}
/* Trigger button reset so it matches text nav-links */
.nav-trigger{background:none;border:none;font-family:var(--sans);cursor:pointer}
.nav.dark .nav-trigger{color:var(--text-inv)}
.nav.dark.scrolled .nav-trigger{color:var(--text-inv)}
.mega-arch-link{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--navy-600);cursor:pointer;white-space:nowrap}
.mega-arch-link:hover{color:var(--navy-700);text-decoration:underline}

/* Mega menu */
.mega{
  position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(8px);
  width:min(680px,92vw);background:var(--card);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--shadow-2);padding:10px;
  opacity:0;visibility:hidden;transition:all .26s var(--ease);
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
}
.has-mega:hover .mega,.has-mega.mega-open .mega,.has-mega:focus-within .mega{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
/* Wide products mega-menu (4 suites) — anchored to the nav row, centered under the bar */
.mega-products{
  width:min(940px,94vw);display:block;padding:20px;
  position:fixed;top:64px;left:50%;transform:translateX(-50%) translateY(8px);
}
.has-mega:hover .mega-products,.has-mega.mega-open .mega-products,.has-mega:focus-within .mega-products{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);top:68px}
/* invisible bridge under the trigger so the cursor can travel into the fixed menu */
.has-mega::after{content:"";position:absolute;left:0;right:0;top:100%;height:18px}
.mega-products-head{display:flex;justify-content:space-between;align-items:center;padding:0 6px 16px;border-bottom:1px solid var(--line);margin-bottom:16px}
.mega-products-head small{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--navy-600)}
.mega-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mega-col{padding:6px}
.mega-col-head{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;cursor:pointer;margin-bottom:6px;transition:background .18s}
.mega-col-head:hover{background:var(--paper-2)}
.mega-ico.sm{width:34px;height:34px;border-radius:9px}
.mega-col-head h5{font-family:var(--sans);font-weight:700;font-size:.86rem;margin:0;color:var(--text)}
.mega-col-head p{font-size:.7rem;color:var(--text-3);margin:1px 0 0;line-height:1.3}
.mega-app{display:flex;flex-direction:column;padding:7px 9px;border-radius:8px;cursor:pointer;transition:background .16s;font-size:.84rem;font-weight:600;color:var(--text-2)}
.mega-app:hover{background:var(--navy-50);color:var(--navy-600)}
.mega-app span{font-size:.7rem;font-weight:400;color:var(--text-3);margin-top:1px}
.mega-head{grid-column:1/-1;padding:12px 14px 8px;border-bottom:1px solid var(--line);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.mega-head small{font-family:var(--mono);font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--text-3)}
.mega-item{display:flex;gap:13px;padding:12px 14px;border-radius:12px;cursor:pointer;transition:background .18s}
.mega-item:hover{background:var(--paper-2)}
.mega-ico{width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff}
.mega-ico svg{width:19px;height:19px}
.mega-item h5{font-family:var(--sans);font-weight:600;font-size:.92rem;margin:0 0 2px;color:var(--text)}
.mega-item p{font-size:.78rem;color:var(--text-3);margin:0;line-height:1.4}

.nav-cta{display:flex;align-items:center;gap:10px}
.burger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:8px;background:none;border:none}
.burger span{width:24px;height:2px;background:var(--text);border-radius:2px;transition:.3s}
.nav.dark .burger span{background:var(--text-inv)}
.nav.dark.scrolled .burger span{background:var(--text-inv)}

/* Mobile drawer */
.drawer{
  position:fixed;inset:0;z-index:200;background:var(--ink);
  transform:translateX(100%);transition:transform .4s var(--ease);
  display:flex;flex-direction:column;padding:84px 28px 40px;overflow-y:auto;
}
.drawer.open{transform:translateX(0)}
.drawer-close{position:absolute;top:22px;right:24px;background:none;border:none;color:#fff;font-size:2rem;cursor:pointer;line-height:1}
.drawer a,.drawer .d-link{display:block;color:var(--text-inv);font-family:var(--display);font-size:1.5rem;padding:14px 0;border-bottom:1px solid var(--ink-line);cursor:pointer}
.drawer .d-sub{font-family:var(--sans);font-size:1rem;color:var(--text-inv-2);padding:9px 0 9px 18px;border:none}

/* ============================================================
   HERO (home)
   ============================================================ */
.hero{position:relative;background:var(--ink);color:#fff;overflow:hidden;padding:148px 0 0}
.hero-bg{position:absolute;inset:0;overflow:hidden}
.hero-grad{position:absolute;width:900px;height:900px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,51,161,.55),transparent 62%);
  top:-340px;right:-180px;filter:blur(20px)}
.hero-grad2{position:absolute;width:620px;height:620px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,166,90,.16),transparent 65%);
  bottom:-280px;left:-160px}
.grid-overlay{position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:54px 54px;mask-image:radial-gradient(ellipse 80% 70% at 60% 25%,#000,transparent 75%)}
.hero-inner{position:relative;z-index:2}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center}
.hero-badge{
  display:inline-flex;align-items:center;gap:10px;padding:7px 15px 7px 7px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);
  border-radius:100px;font-size:.82rem;color:var(--text-inv-2);margin-bottom:26px;backdrop-filter:blur(8px)
}
.hero-badge b{background:var(--gold-500);color:var(--ink);font-size:.66rem;font-weight:700;
  letter-spacing:.06em;padding:4px 9px;border-radius:100px;text-transform:uppercase}
.hero h1{color:#fff;margin-bottom:22px}
.hero h1 .accent{
  background:linear-gradient(120deg,var(--gold-400),var(--gold-500));
  -webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic
}
.hero .lede{color:var(--text-inv-2);max-width:560px;margin-bottom:34px}
.hero-ar{font-family:var(--arabic);direction:rtl;font-size:1.05rem;color:var(--gold-400);margin-bottom:8px;opacity:.92}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:42px}
.hero-trust{display:flex;gap:30px;flex-wrap:wrap;padding-top:30px;border-top:1px solid var(--ink-line)}
.hero-trust .t{display:flex;flex-direction:column;gap:3px}
.hero-trust .t b{font-family:var(--display);font-size:1.7rem;color:#fff;line-height:1}
.hero-trust .t span{font-size:.78rem;color:var(--text-inv-2)}

/* Hero architecture card — the "four suites on one core" truth, drawn */
.arch-card{
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.13);border-radius:var(--r-xl);
  padding:26px;backdrop-filter:blur(14px);box-shadow:0 30px 80px rgba(0,0,0,.4)
}
.arch-card .ac-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.arch-card .ac-top span{font-family:var(--mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--text-inv-2)}
.ac-dots{display:flex;gap:6px}
.ac-dots i{width:9px;height:9px;border-radius:50%;display:block}
.ac-suites{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.ac-suite{border-radius:14px;padding:15px;border:1px solid rgba(255,255,255,.12)}
.ac-suite.ds{background:linear-gradient(160deg,rgba(14,110,122,.32),rgba(14,110,122,.08))}
.ac-suite.bp{background:linear-gradient(160deg,rgba(0,51,161,.4),rgba(0,51,161,.12))}
.ac-suite.sec{background:linear-gradient(160deg,rgba(178,58,72,.34),rgba(178,58,72,.1))}
.ac-suite.insight{background:linear-gradient(160deg,rgba(91,63,168,.34),rgba(91,63,168,.1))}
.ac-suite h6{font-family:var(--sans);font-size:.8rem;font-weight:700;color:#fff;margin:0 0 9px;letter-spacing:.02em}
.ac-suite .apps{display:flex;flex-wrap:wrap;gap:5px}
.ac-suite .apps em{font-style:normal;font-size:.68rem;font-family:var(--mono);color:var(--text-inv-2);
  background:rgba(255,255,255,.08);padding:3px 7px;border-radius:5px}
.ac-bus{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:11px;
  background:rgba(201,166,90,.12);border:1px solid rgba(201,166,90,.3);margin-bottom:12px}
.ac-bus .pulse{width:8px;height:8px;border-radius:50%;background:var(--gold-400);flex:none;
  box-shadow:0 0 0 0 rgba(220,192,127,.7);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,192,127,.6)}70%{box-shadow:0 0 0 10px rgba(220,192,127,0)}100%{box-shadow:0 0 0 0 rgba(220,192,127,0)}}
.ac-bus span{font-family:var(--mono);font-size:.72rem;color:var(--gold-400);letter-spacing:.04em}
.ac-core{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ac-core em{font-style:normal;text-align:center;font-size:.62rem;font-family:var(--mono);
  color:var(--text-inv-2);background:rgba(255,255,255,.05);padding:7px 2px;border-radius:7px;border:1px solid rgba(255,255,255,.07)}

/* ============================================================
   LOGOS / MARQUEE STRIP
   ============================================================ */
.strip{background:var(--ink-soft);border-top:1px solid var(--ink-line);border-bottom:1px solid var(--ink-line);padding:26px 0}
.strip-inner{display:flex;align-items:center;gap:40px;justify-content:center;flex-wrap:wrap}
.strip-label{font-family:var(--mono);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--text-inv-2)}
.strip-items{display:flex;gap:30px;flex-wrap:wrap;align-items:center}
.strip-items span{font-family:var(--display);font-size:1.05rem;color:rgba(255,255,255,.55);font-weight:600;letter-spacing:.02em}

/* ============================================================
   GENERIC SECTION HEADERS
   ============================================================ */
.sec-head{max-width:720px;margin-bottom:54px}
.sec-head.center{margin-left:auto;margin-right:auto;text-align:center}
.sec-head .lede{margin-top:14px}

/* ---------- Principles grid ---------- */
.principles{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.principle{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:30px;transition:all .3s var(--ease);position:relative;overflow:hidden
}
.principle:hover{transform:translateY(-5px);box-shadow:var(--shadow-2);border-color:var(--navy-200)}
.principle .num{font-family:var(--mono);font-size:.74rem;color:var(--gold-600);letter-spacing:.1em;margin-bottom:14px}
.principle .pic{width:46px;height:46px;border-radius:12px;background:var(--navy-50);
  display:grid;place-items:center;color:var(--navy-600);margin-bottom:16px}
.principle .pic svg{width:23px;height:23px}
.principle h4{margin-bottom:9px}
.principle p{font-size:.92rem;color:var(--text-2);margin:0}

/* ============================================================
   SUITE BLOCKS (home + suite pages)
   ============================================================ */
.suite-block{position:relative}
.suite-hero{border-radius:var(--r-xl);overflow:hidden;position:relative;padding:clamp(40px,5vw,64px)}
.suite-hero.ds{background:linear-gradient(150deg,var(--teal-700),var(--teal-600) 70%,#0c5a64)}
.suite-hero.sec{background:linear-gradient(150deg,#7E2531,#B23A48 75%)}
.suite-hero.insight{background:linear-gradient(150deg,#3C2A73,#5B3FA8 75%)}
.suite-hero.bp{background:linear-gradient(150deg,var(--navy-800),var(--navy-600) 75%)}
.suite-hero{color:#fff}
.suite-hero .eyebrow{color:rgba(255,255,255,.85)}
.suite-hero .eyebrow::before{background:rgba(255,255,255,.6)}
.suite-hero h2{color:#fff;max-width:640px}
.suite-hero .lede{color:rgba(255,255,255,.86);max-width:580px;margin-top:14px}
.suite-bgtext{position:absolute;right:-10px;bottom:-40px;font-family:var(--display);
  font-size:clamp(7rem,18vw,16rem);font-weight:600;color:rgba(255,255,255,.05);line-height:.8;pointer-events:none;font-style:italic}

.apps-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:30px}
.app-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:26px;cursor:pointer;transition:all .3s var(--ease);position:relative;
  display:flex;flex-direction:column;gap:14px;
}
.app-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-2)}
.app-card .ac-h{display:flex;align-items:flex-start;gap:14px}
.app-ico{width:48px;height:48px;border-radius:13px;flex:none;display:grid;place-items:center;color:#fff}
.app-ico svg{width:24px;height:24px}
.app-card h4{margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.app-card .ar{font-family:var(--arabic);font-size:.92rem;color:var(--text-3);font-weight:500}
.app-card .role{font-size:.82rem;color:var(--text-3);margin:2px 0 0;font-family:var(--mono);letter-spacing:.02em}
.app-card p{font-size:.9rem;color:var(--text-2);margin:0}
.app-card .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.chip{font-size:.72rem;font-family:var(--mono);background:var(--paper-2);color:var(--text-2);
  padding:4px 9px;border-radius:6px;border:1px solid var(--line)}
.app-card .more{font-size:.84rem;font-weight:600;color:var(--navy-600);display:inline-flex;align-items:center;gap:6px}

.badge-new{font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  background:var(--gold-100);color:var(--gold-600);padding:3px 7px;border-radius:5px}
.badge-ga{font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  background:#DCFCE7;color:#15803D;padding:3px 7px;border-radius:5px}
.badge-soon{font-size:.6rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  background:var(--paper-2);color:var(--text-3);padding:3px 7px;border-radius:5px;border:1px solid var(--line)}

/* ============================================================
   CORE ENGINES (platform)
   ============================================================ */
.engines{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.engine{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;transition:all .25s}
.engine:hover{border-color:var(--navy-300);box-shadow:var(--shadow-1);transform:translateY(-3px)}
.engine h5{display:flex;align-items:center;gap:6px}
.eng-arrow{width:14px;height:14px;opacity:0;transform:translateX(-4px);transition:all .2s var(--ease);color:var(--navy-600)}
.engine:hover .eng-arrow{opacity:1;transform:translateX(0)}
.engine .ei{width:38px;height:38px;border-radius:10px;background:var(--navy-50);display:grid;place-items:center;color:var(--navy-600);margin-bottom:12px}
.engine .ei svg{width:19px;height:19px}
.engine h5{font-family:var(--sans);font-weight:700;font-size:.94rem;margin:0 0 5px}
.engine p{font-size:.8rem;color:var(--text-3);margin:0;line-height:1.45}

/* ============================================================
   DEPLOYMENT / SOVEREIGNTY
   ============================================================ */
.deploy-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.deploy{border-radius:var(--r-lg);padding:32px;border:1px solid;position:relative;overflow:hidden}
.deploy.saas{background:var(--navy-50);border-color:var(--navy-200)}
.deploy.onprem{background:#fff;border-color:var(--line-2)}
.deploy.airgap{background:var(--ink);border-color:var(--ink-line);color:#fff}
.deploy h4{margin-bottom:8px}
.deploy.airgap h4{color:#fff}
.deploy .dtag{font-family:var(--mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:18px;display:block}
.deploy.saas .dtag{color:var(--navy-600)}
.deploy.onprem .dtag{color:var(--text-3)}
.deploy.airgap .dtag{color:var(--gold-400)}
.deploy p{font-size:.9rem;margin:0 0 16px}
.deploy.airgap p{color:var(--text-inv-2)}
.deploy ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.deploy li{font-size:.86rem;display:flex;gap:9px;align-items:flex-start}
.deploy li svg{width:16px;height:16px;flex:none;margin-top:3px;color:var(--ok)}
.deploy.airgap li{color:var(--text-inv)}
.deploy.airgap li svg{color:var(--gold-400)}

/* ============================================================
   STATS BAND
   ============================================================ */
.stats-band{background:var(--ink);color:#fff;position:relative;overflow:hidden}
.stats-band .grid-overlay{opacity:.4}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;position:relative;z-index:2}
.stat{text-align:center;padding:18px}
.stat b{font-family:var(--display);font-size:clamp(2.6rem,5vw,3.8rem);color:#fff;line-height:1;display:block;margin-bottom:10px}
.stat b em{color:var(--gold-400);font-style:normal}
.stat span{font-size:.86rem;color:var(--text-inv-2);line-height:1.4;display:block}

/* ============================================================
   EVENT BUS — the signature element
   ============================================================ */
.bus-section{background:linear-gradient(180deg,var(--paper),var(--paper-2));position:relative;overflow:hidden}
.bus-diagram{position:relative;margin-top:50px;padding:40px 0}
.bus-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;position:relative;z-index:2}
.bus-node{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;transition:all .25s}
.bus-node:hover{transform:translateY(-3px);box-shadow:var(--shadow-1);border-color:var(--navy-300)}
.bus-node h6{font-family:var(--sans);font-weight:700;font-size:.84rem;margin:0 0 4px}
.bus-node span{font-family:var(--mono);font-size:.68rem;color:var(--text-3)}
.bus-spine{margin:26px 0;padding:18px 22px;border-radius:14px;
  background:linear-gradient(90deg,var(--navy-700),var(--navy-600),var(--teal-600));
  color:#fff;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow-navy);position:relative;overflow:hidden}
.bus-spine::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.18),transparent);
  transform:translateX(-100%);animation:sweep 3.4s var(--ease) infinite}
@keyframes sweep{to{transform:translateX(100%)}}
.bus-spine .bl{font-family:var(--mono);font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-400);flex:none}
.bus-spine .bt{font-family:var(--display);font-size:1.15rem;font-weight:600;flex:1;min-width:0}
.bus-events{display:flex;gap:7px;flex-wrap:wrap}
.bus-events em{font-style:normal;font-family:var(--mono);font-size:.66rem;color:#fff;
  background:rgba(255,255,255,.14);padding:4px 9px;border-radius:6px}

/* ============================================================
   COMPARE TABLE
   ============================================================ */
.cmp{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-1)}
.cmp-row{display:grid;grid-template-columns:1.4fr 1fr 1fr;border-bottom:1px solid var(--line)}
.cmp-row:last-child{border-bottom:none}
.cmp-row.head{background:var(--ink);color:#fff}
.cmp-row.head>div{padding:20px 22px;font-family:var(--sans);font-weight:700;font-size:.92rem}
.cmp-row.head .c-clario{background:var(--navy-600);position:relative}
.cmp-row.head .c-clario::before{content:"RECOMMENDED";position:absolute;top:6px;right:14px;
  font-family:var(--mono);font-size:.56rem;letter-spacing:.1em;color:var(--gold-400)}
.cmp-row>div{padding:16px 22px;font-size:.88rem;display:flex;align-items:center;gap:9px}
.cmp-row .c-label{font-weight:600;color:var(--text)}
.cmp-row .c-clario{background:var(--navy-50);font-weight:500;color:var(--navy-700)}
.cmp-row .c-other{color:var(--text-3)}
.cmp-row svg{width:17px;height:17px;flex:none}
.cmp .yes{color:var(--ok)}.cmp .no{color:var(--text-3);opacity:.5}

/* ============================================================
   PRICING
   ============================================================ */
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;align-items:start}
.tier{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:34px;position:relative;transition:all .3s var(--ease)}
.tier:hover{box-shadow:var(--shadow-2);transform:translateY(-4px)}
.tier.featured{border-color:var(--navy-600);box-shadow:var(--shadow-navy);transform:scale(1.02)}
.tier.featured:hover{transform:scale(1.02) translateY(-4px)}
.tier .ribbon{position:absolute;top:-13px;left:34px;background:var(--gold-500);color:var(--ink);
  font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 13px;border-radius:6px}
.tier h3{margin-bottom:6px}
.tier .tdesc{font-size:.88rem;color:var(--text-3);margin-bottom:22px;min-height:42px}
.tier .price{font-family:var(--display);font-size:2.4rem;font-weight:600;margin-bottom:4px}
.tier .price small{font-size:.92rem;color:var(--text-3);font-family:var(--sans);font-weight:400}
.tier .pnote{font-size:.78rem;color:var(--text-3);margin-bottom:24px}
.tier ul{list-style:none;margin:0 0 26px;padding:0;display:flex;flex-direction:column;gap:11px}
.tier li{font-size:.88rem;display:flex;gap:10px;align-items:flex-start;color:var(--text-2)}
.tier li svg{width:17px;height:17px;flex:none;margin-top:3px;color:var(--navy-600)}
.tier .btn{width:100%;justify-content:center}

/* ============================================================
   SUB-PAGE HEADER (interior pages)
   ============================================================ */
.page-hero{background:var(--ink);color:#fff;padding:140px 0 64px;position:relative;overflow:hidden}
.page-hero.suite-ds{background:linear-gradient(150deg,var(--teal-700),var(--teal-600))}
.page-hero.suite-sec{background:linear-gradient(150deg,#7E2531,#B23A48)}
.page-hero.suite-insight{background:linear-gradient(150deg,#3C2A73,#5B3FA8)}
.page-hero.suite-bp{background:linear-gradient(150deg,var(--navy-800),var(--navy-600))}
.page-hero .grid-overlay{opacity:.4}
.page-hero-inner{position:relative;z-index:2;max-width:760px}
.page-hero .eyebrow{color:var(--gold-400)}
.page-hero h1{color:#fff;margin-bottom:18px}
.page-hero .lede{color:var(--text-inv-2)}
.breadcrumb{display:flex;gap:8px;align-items:center;font-size:.82rem;color:var(--text-inv-2);margin-bottom:28px;font-family:var(--mono)}
.breadcrumb a{cursor:pointer;transition:color .2s}
.breadcrumb a:hover{color:#fff}
.breadcrumb svg{width:13px;height:13px;opacity:.5}

/* App detail hero */
.app-hero{display:flex;align-items:center;gap:18px;margin-bottom:18px}
.app-hero .big-ico{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;color:#fff;flex:none}
.app-hero .big-ico svg{width:32px;height:32px}
.app-hero .ar-big{font-family:var(--arabic);direction:rtl;font-size:1.5rem;color:var(--gold-400)}

/* Module list (app pages) */
.modules{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:10px}
.module{display:flex;gap:13px;padding:18px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);transition:all .25s}
.module:hover{border-color:var(--navy-300);box-shadow:var(--shadow-1)}
.module .mi{width:36px;height:36px;border-radius:9px;background:var(--navy-50);display:grid;place-items:center;color:var(--navy-600);flex:none}
.module .mi svg{width:18px;height:18px}
.module h5{font-family:var(--sans);font-weight:600;font-size:.94rem;margin:0 0 3px}
.module p{font-size:.82rem;color:var(--text-3);margin:0;line-height:1.45}

/* Flow steps */
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;margin-top:20px;counter-reset:step}
.flow-step{padding:22px;position:relative;border:1px solid var(--line);border-right:none;background:var(--card)}
.flow-step:first-child{border-radius:var(--r) 0 0 var(--r)}
.flow-step:last-child{border-right:1px solid var(--line);border-radius:0 var(--r) var(--r) 0}
.flow-step .fs-num{width:30px;height:30px;border-radius:50%;background:var(--navy-600);color:#fff;
  font-family:var(--mono);font-size:.82rem;font-weight:600;display:grid;place-items:center;margin-bottom:13px}
.flow-step h6{font-family:var(--sans);font-weight:700;font-size:.92rem;margin:0 0 5px}
.flow-step p{font-size:.8rem;color:var(--text-3);margin:0;line-height:1.42}
@media(max-width:780px){
  .flow{grid-template-columns:1fr}
  .flow-step{border-right:1px solid var(--line)!important;border-bottom:none}
  .flow-step:first-child{border-radius:var(--r) var(--r) 0 0}
  .flow-step:last-child{border-radius:0 0 var(--r) var(--r)}
}

/* spec rows */
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}
.spec{background:var(--navy-50);border:1px solid var(--navy-100);border-radius:var(--r);padding:22px;text-align:center}
.spec b{font-family:var(--display);font-size:2rem;color:var(--navy-700);display:block;line-height:1;margin-bottom:8px}
.spec span{font-size:.82rem;color:var(--text-2)}

/* ============================================================
   SOLUTIONS / persona cards
   ============================================================ */
.persona-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.persona{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:30px;display:flex;flex-direction:column;gap:14px;transition:all .3s}
.persona:hover{box-shadow:var(--shadow-2);transform:translateY(-4px)}
.persona .pi{width:50px;height:50px;border-radius:13px;background:var(--gold-100);display:grid;place-items:center;color:var(--gold-600)}
.persona .pi svg{width:25px;height:25px}
.persona h4{margin:0}
.persona p{font-size:.9rem;color:var(--text-2);margin:0}
.persona .uses{display:flex;flex-direction:column;gap:7px;margin-top:auto}
.persona .uses div{font-size:.84rem;display:flex;gap:9px;align-items:flex-start;color:var(--text-2)}
.persona .uses svg{width:15px;height:15px;flex:none;margin-top:3px;color:var(--navy-600)}

/* ============================================================
   FAQ / accordion
   ============================================================ */
.faq{max-width:820px;margin:0 auto}
.faq-item{border-bottom:1px solid var(--line)}
.faq-q{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:24px 4px;cursor:pointer;font-family:var(--display);font-size:1.18rem;font-weight:600}
.faq-q .fi{width:26px;height:26px;flex:none;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;transition:all .25s;color:var(--navy-600)}
.faq-item.open .fi{background:var(--navy-600);border-color:var(--navy-600);color:#fff;transform:rotate(45deg)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .35s var(--ease)}
.faq-a p{padding:0 4px 24px;color:var(--text-2);margin:0;font-size:.95rem}

/* ============================================================
   CTA BAND
   ============================================================ */
.cta-band{background:linear-gradient(150deg,var(--navy-800),var(--navy-600));color:#fff;border-radius:var(--r-xl);padding:clamp(44px,6vw,72px);text-align:center;position:relative;overflow:hidden}
.cta-band .hero-grad{top:-300px;opacity:.5}
.cta-band h2{color:#fff;position:relative;z-index:2;max-width:640px;margin:0 auto 16px}
.cta-band p{color:var(--text-inv-2);position:relative;z-index:2;max-width:520px;margin:0 auto 30px;font-size:1.08rem}
.cta-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;position:relative;z-index:2}

/* ============================================================
   CONTACT
   ============================================================ */
.contact-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:50px;align-items:start}
.contact-info{display:flex;flex-direction:column;gap:26px}
.ci-item{display:flex;gap:15px}
.ci-item .cii{width:44px;height:44px;border-radius:11px;background:var(--navy-50);display:grid;place-items:center;color:var(--navy-600);flex:none}
.ci-item .cii svg{width:21px;height:21px}
.ci-item h5{font-family:var(--sans);font-weight:700;margin:0 0 3px;font-size:.98rem}
.ci-item p{margin:0;font-size:.9rem;color:var(--text-2)}
.form-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:34px;box-shadow:var(--shadow-1)}
.field{margin-bottom:18px}
.field label{display:block;font-size:.84rem;font-weight:600;margin-bottom:7px;color:var(--text)}
.field input,.field select,.field textarea{
  width:100%;padding:12px 15px;border:1.5px solid var(--line-2);border-radius:9px;
  font-family:var(--sans);font-size:.94rem;background:var(--paper);color:var(--text);transition:all .2s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--navy-600);background:#fff;box-shadow:0 0 0 4px rgba(0,51,161,.1)}
.field textarea{resize:vertical;min-height:110px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.form-note{font-size:.8rem;color:var(--text-3);margin-top:8px}

/* ============================================================
   FOOTER
   ============================================================ */
.footer{background:var(--ink);color:var(--text-inv-2);padding:70px 0 32px;position:relative;overflow:hidden}
.footer-top{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:34px;margin-bottom:50px;position:relative;z-index:2}
.footer-brand .logo-text{color:#fff;margin-bottom:14px}
.footer-brand p{font-size:.9rem;line-height:1.6;max-width:280px;margin-bottom:18px}
.footer-ar{font-family:var(--arabic);direction:rtl;color:var(--gold-400);font-size:.95rem;margin-top:6px}
.footer-col h6{font-family:var(--mono);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--text-inv);margin:0 0 18px}
.footer-col a{display:block;font-size:.88rem;padding:6px 0;color:var(--text-inv-2);cursor:pointer;transition:color .2s}
.footer-col a:hover{color:#fff}
.footer-bottom{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;
  padding-top:28px;border-top:1px solid var(--ink-line);position:relative;z-index:2}
.footer-bottom p{font-size:.82rem;margin:0}
.footer-legal{display:flex;gap:22px;flex-wrap:wrap}
.footer-legal a{font-size:.82rem;cursor:pointer}
.footer-legal a:hover{color:#fff}
.footer-badges{display:flex;gap:10px;flex-wrap:wrap}

   ============================================================ */

.mt0{margin-top:0}.mb0{margin-bottom:0}
.split{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}

@media(max-width:980px){

  .principles,.engines,.deploy-grid,.stats-grid,.tiers,.persona-grid{grid-template-columns:1fr 1fr}
  .apps-grid,.modules,.specs,.contact-grid,.split{grid-template-columns:1fr}

  .footer-brand{grid-column:1/-1}
}
@media(max-width:620px){
  .wrap{padding:0 20px}
  .principles,.engines,.deploy-grid,.stats-grid,.tiers,.persona-grid,.apps-grid,.cmp-row,.field-row{grid-template-columns:1fr}

  .ac-core{grid-template-columns:repeat(2,1fr)}
  .hero-actions .btn,.cta-actions .btn{width:100%;justify-content:center}

}

   ============================================================ */
.home-links{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.home-link{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px;transition:all .25s var(--ease);text-decoration:none}
.home-link:hover{border-color:var(--navy-300);box-shadow:var(--shadow-1);transform:translateY(-3px)}
.hl-ico{width:46px;height:46px;border-radius:12px;background:var(--navy-50);display:grid;place-items:center;color:var(--navy-600);flex:none}
.hl-ico svg{width:23px;height:23px}
.home-link h4{margin:0 0 4px;font-size:1.08rem}
.home-link p{margin:0;font-size:.84rem;color:var(--text-3);line-height:1.4}
.hl-arrow{width:18px;height:18px;color:var(--navy-600);flex:none;margin-left:auto;opacity:0;transform:translateX(-4px);transition:all .2s var(--ease)}

.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}

.res-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-2);border-color:var(--navy-200)}
.res-ico{width:48px;height:48px;border-radius:13px;background:var(--navy-50);display:grid;place-items:center;color:var(--navy-600)}

.res-card h4{margin:0}

.calc-controls{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;margin-bottom:32px}

.calc-range{display:flex;align-items:center;gap:16px}
.calc-range input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:6px;background:var(--navy-100);outline-offset:4px}
.calc-range input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:var(--navy-600);cursor:pointer;box-shadow:0 2px 8px rgba(0,51,161,.4);transition:transform .15s}

.calc-range output{font-family:var(--mono);font-size:.92rem;font-weight:600;color:var(--navy-700);min-width:54px;text-align:right}
.calc-results{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px}
.calc-result{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);padding:22px;text-align:center}

.cfg-summary .btn{align-self:flex-start}

@media(max-width:980px){

}
@media(max-width:620px){

}

      </div>
    </div>
    <p class="calc-note">Illustrative model for comparison only — not a quote. It assumes a per-tool licence baseline, per-user scaling, and ongoing integration maintenance that a unified platform removes. We'll build a costed model for your environment on request.</p>

// pure function so it can be unit-checked
function roiCompute(tools,usersHundreds,integrations){
  const users=usersHundreds*100;
  const perToolBase=42000;                 // avg annual licence per point tool
  const perUserStack=tools*48;             // per-user cost scales with tool count
  const intUpkeep=integrations*16000;      // annual maintenance per brittle integration
  const stack=tools*perToolBase + users*perUserStack + intUpkeep;
  // platform: flat suite licensing + gentler per-user, no integration tax
  const platform=4*78000 + users*70 + 90000;
  return {stack,platform,save:Math.max(0,stack-platform)};
}
function fmtMoney(n){
  if(n>=1e6) return '$'+(n/1e6).toFixed(2)+'M';
  if(n>=1e3) return '$'+Math.round(n/1e3)+'K';
  return '$'+Math.round(n);
}
function updateRoi(){
  const t=+document.getElementById('roi-tools').value;
  const u=+document.getElementById('roi-users').value;
  const i=+document.getElementById('roi-integrations').value;
  document.getElementById('roi-tools-val').textContent=t;
  document.getElementById('roi-users-val').textContent=(u*100).toLocaleString();
  document.getElementById('roi-int-val').textContent=i;
  const r=roiCompute(t,u,i);
  document.getElementById('roi-stack').textContent=fmtMoney(r.stack);
  document.getElementById('roi-platform').textContent=fmtMoney(r.platform);
  document.getElementById('roi-save').textContent=fmtMoney(r.save);
}

const _cfg={suites:new Set(),deploy:'SaaS'};
function toggleCfg(id,btn){
  if(_cfg.suites.has(id)){_cfg.suites.delete(id);btn.setAttribute('aria-pressed','false');btn.classList.remove('selected');}
  else{_cfg.suites.add(id);btn.setAttribute('aria-pressed','true');btn.classList.add('selected');}
  renderCfg();
}
function setCfgDeploy(btn,val){
  _cfg.deploy=val;
  [...btn.parentElement.children].forEach(b=>{b.classList.toggle('active',b===btn);b.setAttribute('aria-checked',b===btn?'true':'false');});
  renderCfg();
}
function renderCfg(){
  const names={datastream:'DataStream','business-plus':'Business+',clariosec:'ClarioSec',clarioinsight:'ClarioInsight'};
  const sel=[..._cfg.suites];
  const appCount=sel.reduce((n,id)=>n+SUITES[id].apps.length,0);
  const sEl=document.getElementById('cfg-suites'); if(!sEl)return;
  sEl.textContent=sel.length?sel.map(id=>names[id]).join(', '):'No suites yet';
  document.getElementById('cfg-appcount').textContent=appCount;
  let tier='—';
  if(_cfg.deploy==='Air-gapped') tier='Sovereign';
  else if(sel.length>=3) tier='Platform';
  else if(sel.length>=1) tier='Suite';
  document.getElementById('cfg-tier').textContent=tier;
}

function go(path){
  if(location.hash.slice(1)===path){ window.scrollTo(0,0); return; }
  location.hash=path;
}
/* Click handler for nav links: respects modifier-clicks (open in new tab), else routes */
function navGo(e,path){
  if(e&&(e.metaKey||e.ctrlKey||e.shiftKey||e.button===1))return; // let browser handle new-tab
  if(e)e.preventDefault();
  closeMega();
  closeDrawer();
  go(path);
}
const ROUTE_TITLES={
  '/':'Clario360 — The Sovereign Enterprise Platform',
  '/platform':'Platform Architecture — Clario360',
  '/solutions':'Solutions by Role — Clario360',
  '/sovereignty':'Sovereignty & Security — Clario360',
  '/resources':'Resources & Documentation — Clario360',
  '/compare':'Why Clario360 — Platform vs Point Tools',
  '/pricing':'Pricing — Clario360',
  '/about':'About — Clario360',
  '/contact':'Request a Demo — Clario360',
};
function setTitle(path,seg){
  let t=ROUTE_TITLES[path];
  if(!t){
    if((seg[0]==='datastream'||seg[0]==='business-plus'||seg[0]==='clariosec'||seg[0]==='clarioinsight')){
      const s=SUITES[seg[0]];
      if(s&&seg[1]){const a=s.apps.find(x=>x.id===seg[1]); t=a?`${a.name} — ${s.name} — Clario360`:`${s.name} — Clario360`;}
      else if(s) t=`${s.name} — Clario360`;
    } else if(seg[0]==='platform'&&seg[1]){
      const e=ENGINES.find(x=>x[3]===seg[1]); t=e?`${e[0]} — Platform Core — Clario360`:'Platform — Clario360';
    }
  }
  document.title=t||'Clario360 — The Sovereign Enterprise Platform';
}
function route(){
  const path=(location.hash.slice(1)||'/').replace(/\/+$/,'')||'/';
  const seg=path.split('/').filter(Boolean);
  let html;
  if(path==='/') html=pageHome();
  else if(seg[0]==='platform'){ html = seg[1] ? pageEngine(seg[1]) : pagePlatform(); }
  else if(seg[0]==='solutions') html=pageSolutions();
  else if(seg[0]==='sovereignty'||seg[0]==='security') html=pageSovereignty();
  else if(seg[0]==='resources') html=pageResources();
  else if(seg[0]==='compare') html=pageCompare();
  else if(seg[0]==='pricing') html=pagePricing();
  else if(seg[0]==='about') html=pageAbout();
  else if(seg[0]==='contact') html=pageContact();
  else if((seg[0]==='datastream'||seg[0]==='business-plus'||seg[0]==='clariosec'||seg[0]==='clarioinsight')){
    if(seg[1]) html=pageApp(seg[0],seg[1]);
    else html=pageSuite(seg[0]);
  }
  else html=page404();
  const app=document.getElementById('app');
  app.innerHTML=html;
  setTitle(path,seg);
  window.scrollTo(0,0);
  initScroll();
  observeFade();
  closeDrawer();
  closeMega();
  if(document.getElementById('roi-calc')) updateRoi();
  if(document.getElementById('suite-cfg')) renderCfg();
  // Move focus to main content for screen-reader and keyboard users after route change
  const main=document.getElementById('main');
  if(main){ main.setAttribute('tabindex','-1'); main.focus({preventScroll:true}); }
}

// Global keyboard: Escape closes any open overlay
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ closeMega(); if(document.getElementById('drawer')?.classList.contains('open')) toggleDrawer(false); }
});

/* ============================================================
   INTERACTIONS
   ============================================================ */
function initScroll(){
  const nav=document.getElementById('nav');
  if(!nav)return;
  const onScroll=()=>{ nav.classList.toggle('scrolled', window.scrollY>20); };
  onScroll();
  window.onscroll=onScroll;
}
function observeFade(){
  const els=[...document.querySelectorAll('.fade-up')];
  if(!els.length)return;
  if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return;}
  const reveal=el=>el.classList.add('in');
  const vh=window.innerHeight||800;
  els.forEach(el=>{ if(el.getBoundingClientRect().top < vh*1.1) reveal(el); });
  const io=new IntersectionObserver((ents)=>{
    ents.forEach(e=>{ if(e.isIntersecting){ reveal(e.target); io.unobserve(e.target); } });
  },{threshold:.08,rootMargin:'0px 0px -10% 0px'});
  els.forEach(e=>{ if(!e.classList.contains('in')) io.observe(e); });
  setTimeout(()=>els.forEach(reveal),1200);
}
/* Mega-menu (click + keyboard accessible) */
function toggleMega(btn){
  const open=btn.getAttribute('aria-expanded')==='true';
  closeMega();
  if(!open){
    btn.setAttribute('aria-expanded','true');
    btn.closest('.has-mega').classList.add('mega-open');
  }
}
function closeMega(){
  document.querySelectorAll('.has-mega.mega-open').forEach(m=>{
    m.classList.remove('mega-open');
    const b=m.querySelector('.nav-trigger'); if(b)b.setAttribute('aria-expanded','false');
  });
}
function megaKey(e,btn){
  if(e.key==='ArrowDown'||e.key==='Enter'||e.key===' '){
    e.preventDefault();
    if(btn.getAttribute('aria-expanded')!=='true') toggleMega(btn);
    const first=btn.closest('.has-mega').querySelector('.mega a'); if(first)first.focus();
  } else if(e.key==='Escape'){ closeMega(); btn.focus(); }
}
// Close mega when focus leaves the menu entirely
document.addEventListener('focusin',e=>{
  const open=document.querySelector('.has-mega.mega-open');
  if(open&&!open.contains(e.target)) closeMega();
});
// Close mega/drawer on outside click
document.addEventListener('click',e=>{
  const open=document.querySelector('.has-mega.mega-open');
  if(open&&!open.contains(e.target)) closeMega();
});

/* Drawer with focus trap */
let _lastFocus=null;
function toggleDrawer(open){
  const d=document.getElementById('drawer');
  if(!d)return;
  d.classList.toggle('open',open);
  d.setAttribute('aria-hidden',open?'false':'true');
  document.body.style.overflow=open?'hidden':'';
  const burger=document.querySelector('.burger');
  if(burger)burger.setAttribute('aria-expanded',open?'true':'false');
  if(open){
    _lastFocus=document.activeElement;
    const first=d.querySelector('.drawer-close'); if(first)first.focus();
    d.addEventListener('keydown',trapDrawer);
  } else {
    d.removeEventListener('keydown',trapDrawer);
    if(_lastFocus&&_lastFocus.focus)_lastFocus.focus();
  }
}
function trapDrawer(e){
  if(e.key!=='Tab')return;
  const d=document.getElementById('drawer');
  const f=[...d.querySelectorAll('button,a,[tabindex]:not([tabindex="-1"])')].filter(el=>el.offsetParent!==null);
  if(!f.length)return;
  const first=f[0],last=f[f.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
}
function closeDrawer(){ toggleDrawer(false); }
function toggleFaq(i){
  const item=document.getElementById('faq-'+i);
  if(!item)return;
  const a=item.querySelector('.faq-a');
  const btn=item.querySelector('.faq-q');
  const isOpen=item.classList.toggle('open');
  a.style.maxHeight=isOpen?a.scrollHeight+'px':'0';
  if(btn)btn.setAttribute('aria-expanded',isOpen?'true':'false');
}
function submitForm(e){
  e.preventDefault();
  const btn=e.target.closest('button');
  btn.innerHTML='Thank you — we\'ll be in touch ✓';
  btn.style.background='var(--ok)';
  btn.disabled=true;
}
</script>
