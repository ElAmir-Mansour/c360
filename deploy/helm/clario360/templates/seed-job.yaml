{{- if .Values.seedData.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "clario360.fullname" . }}-seed
  namespace: {{ include "clario360.namespace" . }}
  labels:
    {{- include "clario360.labels" . | nindent 4 }}
    app.kubernetes.io/component: seed
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: {{ .Values.seedData.activeDeadlineSeconds | default 600 }}
  backoffLimit: {{ .Values.seedData.backoffLimit | default 3 }}
  template:
    metadata:
      labels:
        {{- include "clario360.labels" . | nindent 8 }}
        app.kubernetes.io/component: seed
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "clario360.fullname" . }}-seed
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ .Values.database.host }} {{ .Values.database.port }}; do echo "Waiting for database..."; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: seeder
          image: {{ include "clario360.image" (dict "imageConfig" .Values.seedData.image "root" . "defaultRepo" .Values.seedData.image.repository) }}
          imagePullPolicy: {{ .Values.seedData.image.pullPolicy | default "IfNotPresent" }}
          command: ["/seeder"]
          # The /seeder binary is cmd/seeder, which seeds cybersecurity demo
          # data into a single database. It accepts only --db-url (and reads
          # CYBER_SEED_TENANT_ID from the environment); the other suites have
          # no equivalent seeder yet, so passing per-suite --*-db-url flags
          # would fail flag parsing.
          args:
            - "--db-url=$(CYBER_DB_URL)"
          env:
            - name: CYBER_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "clario360.fullname" . }}-database-credentials
                  key: CYBER_DB_URL
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: {{ include "clario360.sharedConfigMapName" . }}
                  key: ENVIRONMENT
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
