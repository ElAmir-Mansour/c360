  # --- Shared Metrics (DB, Kafka via observability) ---
  # These are scraped from each service above and relabeled globally

  # --- Infrastructure ---

  - job_name: "clario360-node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "clario360-kube-state-metrics"
