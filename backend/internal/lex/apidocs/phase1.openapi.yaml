components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by Clario360 IAM. Tenant context is derived and injected by the gateway.

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    ContractID:
      name: contractId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    ClauseID:
      name: clauseId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    RecipientID:
      name: recipientId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    WorkflowInstanceID:
      name: workflowInstanceID
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    TaskID:
      name: taskID
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 25
    Search:
      name: search
      in: query
      schema:
        type: string
    Sort:
      name: sort
      in: query
      schema:
        type: string
    Order:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]

  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication or tenant context is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: The caller lacks the required Lex permission or Watheeq entitlement.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource state conflicts with the requested operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: The request is syntactically valid but one or more fields failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NoContent:
      description: Operation completed with no response body.

  schemas:
    UUID:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    Metadata:
      type: object
      additionalProperties: true
    DraftingRequest:
      type: object
      description: LLM-backed drafting payload; concrete fields vary by drafting operation and are validated by the route handler.
      additionalProperties: true
    DraftingTemplateSection:
      type: object
      description: Deterministic template section used by `/drafting/assemble`.
      additionalProperties: false
      properties:
        id:
          type: string
          description: Stable section identifier. When omitted, the backend uses the trimmed heading for include/skip reporting.
        heading:
          type: string
        body:
          type: string
        condition:
          type: string
          description: Optional safe condition expression such as `include_arbitration == true`, `tier`, or `!is_draft`.
    DraftingAssemblyRequest:
      type: object
      required: [sections]
      additionalProperties: false
      properties:
        sections:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/DraftingTemplateSection"
        variables:
          $ref: "#/components/schemas/Metadata"
    DraftingAssemblyResult:
      type: object
      properties:
        document:
          type: string
        included_sections:
          type: array
          items:
            type: string
        skipped_sections:
          type: array
          items:
            type: string
        unresolved_vars:
          type: array
          items:
            type: string
    DraftingAssemblyResultEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/DraftingAssemblyResult"
    DraftingResultEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          additionalProperties: true
        request_id:
          type: string
    Pagination:
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    FileReference:
      type: object
      required: [file_id, file_name, file_size_bytes, content_hash]
      properties:
        file_id:
          $ref: "#/components/schemas/UUID"
        file_name:
          type: string
        file_size_bytes:
          type: integer
          format: int64
        content_hash:
          type: string
        extracted_text:
          type: string
        change_summary:
          type: string

    ContractType:
      type: string
      enum: [service_agreement, nda, employment, vendor, license, lease, partnership, consulting, procurement, sla, mou, amendment, renewal, other]
    ContractStatus:
      type: string
      enum: [draft, internal_review, legal_review, negotiation, pending_signature, active, suspended, expired, terminated, renewed, cancelled]
    AnalysisStatus:
      type: string
      enum: [pending, analyzing, completed, failed]
    RiskLevel:
      type: string
      enum: [critical, high, medium, low, none]
    ClauseType:
      type: string
      enum: [indemnification, termination, limitation_of_liability, confidentiality, ip_ownership, non_compete, payment_terms, warranty, force_majeure, dispute_resolution, data_protection, governing_law, assignment, insurance, audit_rights, sla, auto_renewal, representations, non_solicitation, other]
    ClauseReviewStatus:
      type: string
      enum: [pending, reviewed, flagged, accepted, rejected]
    PlaybookStatus:
      type: string
      enum: [draft, active, archived]
    ClauseDeviationKind:
      type: string
      enum: [missing, altered, extra]
    MatterType:
      type: string
      enum: [general, contract, litigation, regulatory, employment, dispute, advisory, other]
    MatterStatus:
      type: string
      enum: [intake, open, in_review, waiting_on_business, on_hold, closed, cancelled]
    LegalPriority:
      type: string
      enum: [critical, high, medium, low]
    ObligationType:
      type: string
      enum: [contractual, renewal, notice, payment, delivery, reporting, compliance, covenant, condition_precedent, regulatory, other]
    ObligationStatus:
      type: string
      enum: [open, in_progress, blocked, completed, waived, cancelled]
    ObligationNotificationType:
      type: string
      enum: [reminder, escalation]
    ObligationNotificationChannel:
      type: string
      enum: [email, calendar, in_app]
    ObligationNotificationOutboxStatus:
      type: string
      enum: [pending, sent, failed]
    DocumentType:
      type: string
      enum: [policy, regulation, template, memo, opinion, filing, correspondence, resolution, power_of_attorney, other]
    DocumentStatus:
      type: string
      enum: [draft, active, archived, superseded]
    DocumentConfidentiality:
      type: string
      enum: [public, internal, confidential, privileged]
    ClauseLibraryStatus:
      type: string
      enum: [draft, active, deprecated, archived]
    ClauseGovernanceStatus:
      type: string
      enum: [pending_review, approved, rejected]
    LibraryGovernanceDecision:
      type: string
      enum: [submit_review, approve, reject]
    LibraryGovernanceDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision:
          $ref: "#/components/schemas/LibraryGovernanceDecision"
        activate:
          type: boolean
        notes:
          type: string
        evidence:
          $ref: "#/components/schemas/Metadata"
    RegulationStatus:
      type: string
      enum: [draft, active, superseded, deprecated, archived]
    RegulationType:
      type: string
      enum: [law, regulation, circular, guidance, standard, policy, other]
    RegulationClauseReferenceType:
      type: string
      enum: [implements, required_by, recommended_by, impacted_by, related]
    ComplianceRuleType:
      type: string
      enum: [expiry_warning, missing_clause, risk_threshold, review_overdue, unsigned_contract, value_threshold, jurisdiction_check, data_protection_required, custom]
    ComplianceSeverity:
      type: string
      enum: [critical, high, medium, low]
    ComplianceAlertStatus:
      type: string
      enum: [open, acknowledged, investigating, resolved, dismissed]
    SignatureTargetType:
      type: string
      enum: [contract, document]
    SignatureEnvelopeStatus:
      type: string
      enum: [draft, sent, viewed, signed, declined, expired, cancelled]
    SignatureProvider:
      type: string
      enum: [native, nafath, external]
    SignatureMethod:
      type: string
      enum: [otp, nafath, certificate, wet_signature]
    SignatureRecipientRole:
      type: string
      enum: [signer, approver, carbon_copy]
    SignatureRecipientStatus:
      type: string
      enum: [draft, sent, viewed, signed, declined, expired, cancelled]
    SignatureEventType:
      type: string
      enum: [created, sent, viewed, signed, declined, expired, cancelled, custody_recorded]
    SignatureRecipientAction:
      type: string
      enum: [view, sign, decline]
    SignatureLanguage:
      type: string
      enum: [en, ar, bilingual]

    Contract:
      type: object
      additionalProperties: true
      required: [id, tenant_id, title, type, party_a_name, party_b_name, status, owner_user_id, owner_name, risk_level, analysis_status, current_version, created_at, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        tenant_id:
          $ref: "#/components/schemas/UUID"
        title:
          type: string
        contract_number:
          type: string
        type:
          $ref: "#/components/schemas/ContractType"
        description:
          type: string
        party_a_name:
          type: string
        party_b_name:
          type: string
        total_value:
          type: number
        currency:
          type: string
          example: SAR
        effective_date:
          $ref: "#/components/schemas/Timestamp"
        expiry_date:
          $ref: "#/components/schemas/Timestamp"
        renewal_date:
          $ref: "#/components/schemas/Timestamp"
        auto_renew:
          type: boolean
        renewal_notice_days:
          type: integer
        signed_date:
          $ref: "#/components/schemas/Timestamp"
        status:
          $ref: "#/components/schemas/ContractStatus"
        owner_user_id:
          $ref: "#/components/schemas/UUID"
        owner_name:
          type: string
        risk_score:
          type: number
        risk_level:
          $ref: "#/components/schemas/RiskLevel"
        analysis_status:
          $ref: "#/components/schemas/AnalysisStatus"
        current_version:
          type: integer
        workflow_instance_id:
          $ref: "#/components/schemas/UUID"
        tags:
          type: array
          items:
            type: string
        metadata:
          $ref: "#/components/schemas/Metadata"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    ContractSummary:
      type: object
      additionalProperties: true
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        title:
          type: string
        type:
          $ref: "#/components/schemas/ContractType"
        status:
          $ref: "#/components/schemas/ContractStatus"
        party_b_name:
          type: string
        risk_level:
          $ref: "#/components/schemas/RiskLevel"
        current_version:
          type: integer
    ContractDetail:
      type: object
      required: [contract, clauses, version_count]
      properties:
        contract:
          $ref: "#/components/schemas/Contract"
        clauses:
          type: array
          items:
            $ref: "#/components/schemas/Clause"
        latest_analysis:
          $ref: "#/components/schemas/ContractRiskAnalysis"
        version_count:
          type: integer
    ContractBriefClause:
      type: object
      required: [id, title, clause_type, risk_level, risk_score, summary]
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        title:
          type: string
        clause_type:
          $ref: "#/components/schemas/ClauseType"
        section_reference:
          type: string
        risk_level:
          $ref: "#/components/schemas/RiskLevel"
        risk_score:
          type: number
        summary:
          type: string
    ContractBriefRisk:
      type: object
      required: [title, description, severity]
      properties:
        title:
          type: string
        description:
          type: string
        severity:
          $ref: "#/components/schemas/RiskLevel"
        clause_reference:
          type: string
        recommendation:
          type: string
        clause_type:
          $ref: "#/components/schemas/ClauseType"
    ContractBriefSignal:
      type: object
      required: [label, value, source]
      properties:
        label:
          type: string
        value:
          type: string
        source:
          type: string
    ContractBrief:
      type: object
      required: [contract_id, title, type, status, counterparty, owner, currency, executive_summary, risk_summary, risk_level, top_clauses, top_risks, obligations, renewal_signals, generated_at]
      properties:
        contract_id:
          $ref: "#/components/schemas/UUID"
        title:
          type: string
        type:
          $ref: "#/components/schemas/ContractType"
        status:
          $ref: "#/components/schemas/ContractStatus"
        counterparty:
          type: string
        owner:
          type: string
        value:
          type: number
        currency:
          type: string
          example: SAR
        effective_date:
          $ref: "#/components/schemas/Timestamp"
        expiry_date:
          $ref: "#/components/schemas/Timestamp"
        renewal_date:
          $ref: "#/components/schemas/Timestamp"
        executive_summary:
          type: string
        risk_summary:
          type: string
        risk_level:
          $ref: "#/components/schemas/RiskLevel"
        risk_score:
          type: number
        top_clauses:
          type: array
          items:
            $ref: "#/components/schemas/ContractBriefClause"
        top_risks:
          type: array
          items:
            $ref: "#/components/schemas/ContractBriefRisk"
        obligations:
          type: array
          items:
            $ref: "#/components/schemas/ContractBriefSignal"
        renewal_signals:
          type: array
          items:
