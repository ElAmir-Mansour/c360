openapi: 3.1.0
info:
  title: Clario360 Watheeq / Lex Service API
  version: 1.0.0
  summary: Legal contract lifecycle, matters, obligations, clause library, regulation library, compliance, and dashboard contract.
  description: |
    Phase 1 contract foundation for the existing Watheeq legal API. The current
    runtime namespace remains Lex at `/api/v1/lex`; `/api/v1/watheeq` is a
    public route alias to the same `lex-service` handlers. Both prefixes are
    gateway-routed and gated with the `app.watheeq` entitlement.

    This contract documents the routes registered in
    `backend/internal/lex/handler/routes.go`. It includes the current local
    contract briefs, signature-envelope, signed-file custody, configurable HTTP
    signature-provider dispatch, provider-event intake, obligation extraction,
    reminder planning/outbox dispatch, configurable HTTP obligation reminder
    provider dispatch, ranked and deterministic semantic clause/regulation search, matter triage/conflict
    APIs, document repository summaries, and contract/matter/obligation reports.
    It does not claim integrations that are not yet proven by the router and
    local tests, including live Nafath credentials, production calendar/email
    delivery adapter acceptance, public webhooks, or external managed vector-search infrastructure.

    Browser clients authenticate with a bearer JWT. The gateway derives the
    tenant from validated token claims, removes any caller-supplied
    `X-Tenant-ID`, and injects trusted tenant context downstream. Frontend
    clients must not supply or select a tenant header in Swagger. Mutating
    same-origin frontend requests also carry the platform CSRF header; the
    shared frontend transport adds `X-Request-ID` and `X-Locale`.
  x-contract-phase: phase-1-foundation
  x-gateway-contract:
    id: watheeq-lex-service
    version: 1.0.0
    api_version: v1
    fail_closed: false
  x-product-name: Watheeq
  x-runtime-namespace: Lex
  x-gateway-entitlement: app.watheeq
  x-route-prefixes:
    - /api/v1/lex
    - /api/v1/watheeq
  x-route-sources:
    - backend/internal/lex/handler/routes.go
    - backend/internal/lex/handler/contract_handler.go
    - backend/internal/lex/handler/document_handler.go
    - backend/internal/lex/handler/matter_handler.go
    - backend/internal/lex/handler/obligation_handler.go
    - backend/internal/lex/handler/signature_handler.go
    - backend/internal/lex/handler/library_handler.go
    - backend/internal/lex/handler/compliance_handler.go
    - backend/internal/lex/handler/dashboard_handler.go
  x-runtime-config:
    obligation_reminder_provider:
      mode_env: LEX_OBLIGATION_REMINDER_PROVIDER_MODE
      endpoint_env: LEX_OBLIGATION_REMINDER_PROVIDER_ENDPOINT
      api_key_env: LEX_OBLIGATION_REMINDER_PROVIDER_API_KEY
      timeout_env: LEX_OBLIGATION_REMINDER_PROVIDER_TIMEOUT
      default_mode: deterministic
      default_timeout: 10s
      modes: [deterministic, http]
      http_requirements:
        - LEX_OBLIGATION_REMINDER_PROVIDER_ENDPOINT must be an absolute http(s) URL when mode is http.
        - LEX_OBLIGATION_REMINDER_PROVIDER_API_KEY is required when mode is http.
        - LEX_OBLIGATION_REMINDER_PROVIDER_TIMEOUT must be greater than zero.
servers:
  - url: /api/v1/lex
    description: Gateway-routed Watheeq service using the incumbent Lex namespace.
  - url: /api/v1/watheeq
    description: Gateway-routed Watheeq alias to the same Lex service handlers.
security:
  - bearerAuth: []
tags:
  - name: Dashboard
  - name: ManagerTasks
  - name: Contracts
  - name: ContractAnalysis
  - name: ContractClauses
  - name: Documents
  - name: Matters
  - name: Obligations
  - name: ClauseLibrary
  - name: RegulationLibrary
  - name: Signatures
  - name: Compliance
  - name: Workflows
  - name: WorkflowPolicies
  - name: Drafting
  - name: Reports
paths:
  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getLexDashboard
      summary: Get tenant legal dashboard rollups.
      x-required-permission: lex:read
      responses:
        "200":
          description: Dashboard data envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LexDashboardEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /dashboard/cases-control:
    get:
      tags: [Dashboard]
      operationId: getLexCasesControlDashboard
      summary: Get the consolidated cases and investigations control panel.
      description: |
        Returns full-portfolio case and investigation aggregates, the five most
        recently updated cases, and the two newest ongoing investigations.
        `resolved_last_7_days` counts distinct lifecycle transitions to `closed`
        during the half-open resolution window; it is not based on case creation
        time. Active investigation rows contain decrypted legal-investigation
        PII and therefore require both domain-view capabilities.
      x-required-permission: lex:case:view AND lex:investigation:view
      responses:
        "200":
          description: Consolidated case-control dashboard.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CaseControlDashboardEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /manager-tasks:
    get:
      tags: [ManagerTasks]
      operationId: listLexManagerTasks
      summary: List visible ad-hoc manager tasks.
      description: Contracts managers, legal directors, and tenant administrators see all tenant tasks; other callers see only tasks they created or were assigned.
      x-required-permission: lex:read with object-level tenant and actor visibility
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ManagerTaskStatus"
        - name: assignee_id
          in: query
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "200":
          description: Paginated manager tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagerTaskListEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [ManagerTasks]
      operationId: createLexManagerTask
      summary: Create and assign an ad-hoc task.
      description: If an attachment is supplied, it must already exist in the Files service as a clean `lex` / `manager_task_attachment` upload by the caller.
      x-required-permission: lex:contract:edit and legal-contracts-manager role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateManagerTaskRequest"
      responses:
        "201":
          description: Created manager task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagerTaskEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /manager-tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [ManagerTasks]
      operationId: getLexManagerTask
      summary: Get a visible manager task.
      x-required-permission: lex:read with object-level tenant and actor visibility
      responses:
        "200":
          description: Manager task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagerTaskEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /manager-tasks/{id}/start:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [ManagerTasks]
      operationId: startLexManagerTask
      summary: Start an assigned or correction-required task.
      description: Only the assigned user may start the task.
      x-required-permission: lex:read with assignee object authorization
      responses:
        "200":
          description: Started manager task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagerTaskEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /manager-tasks/{id}/submit:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [ManagerTasks]
      operationId: submitLexManagerTask
      summary: Submit task results for director review.
      description: Only the assigned user may submit an in-progress task.
      x-required-permission: lex:read with assignee object authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitManagerTaskRequest"
      responses:
        "200":
          description: Submitted manager task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagerTaskEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /manager-tasks/{id}/decision:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [ManagerTasks]
      operationId: decideLexManagerTask
      summary: Accept submitted results or return the task for correction.
      description: Only a legal director who did not create the task may decide a submitted task. A correction note is required when returning it.
      x-required-permission: lex:contract:approve and legal-director role and author-reviewer separation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideManagerTaskRequest"
      responses:
        "200":
          description: Reviewed manager task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagerTaskEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /contracts:
    get:
      tags: [Contracts]
      operationId: listLexContracts
      summary: List contracts with optional filters.
      x-required-permission: lex:read
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Order"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ContractStatus"
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/ContractType"
        - name: risk_level
          in: query
          schema:
            $ref: "#/components/schemas/RiskLevel"
        - name: owner_user_id
          in: query
          schema:
            $ref: "#/components/schemas/UUID"
        - name: department
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: expiring_in_days
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Paginated contracts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Contracts]
      operationId: createLexContract
      summary: Create a contract.
      x-required-permission: lex:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContractRequest"
      responses:
        "201":
          description: Created contract.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /contracts/search:
    get:
      tags: [Contracts]
      operationId: searchLexContracts
      summary: Search contract summaries.
      x-required-permission: lex:read
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated contract summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractSummaryListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /contracts/stats:
    get:
      tags: [Contracts]
      operationId: getLexContractStats
      summary: Get aggregate contract statistics.
      x-required-permission: lex:read
      responses:
        "200":
          description: Contract statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractStatsEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /contracts/expiring:
    get:
      tags: [Contracts]
      operationId: listLexExpiringContracts
      summary: List contracts expiring inside a horizon.
      x-required-permission: lex:read
      parameters:
        - name: horizon_days
          in: query
          schema:
            type: integer
            minimum: 1
            default: 30
      responses:
        "200":
          description: Expiring contracts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpiringContractListEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /contracts/renewal-warnings:
    get:
      tags: [Contracts]
      operationId: getLexContractRenewalWarnings
      summary: Get contract renewal warning summary.
      description: Returns contracts whose renewal notice trigger or expiry falls inside the configured warning horizon.
      x-required-permission: lex:read
      parameters:
        - name: horizon_days
          in: query
          schema:
            type: integer
            minimum: 1
            default: 60
        - name: lead_days
          in: query
          schema:
            type: integer
            minimum: 0
            default: 30
      responses:
        "200":
          description: Renewal warning summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractRenewalWarningSummaryEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /contracts/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Contracts]
      operationId: getLexContract
      summary: Get contract detail, clauses, and latest analysis.
      x-required-permission: lex:read
      responses:
        "200":
          description: Contract detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractDetailEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Contracts]
      operationId: updateLexContract
      summary: Update a contract.
      x-required-permission: lex:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContractRequest"
      responses:
        "200":
          description: Updated contract.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Contracts]
      operationId: deleteLexContract
      summary: Soft-delete a contract.
      x-required-permission: lex:write
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /contracts/{id}/brief:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Contracts]
      operationId: getLexContractBrief
      summary: Get a generated contract brief.
      description: Builds an executive summary, risk summary, top risky clauses, top risk findings, obligation signals, and renewal signals from the current contract detail and latest analysis.
      x-required-permission: lex:read
      responses:
        "200":
          description: Contract brief.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractBriefEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /contracts/{id}/analysis:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [ContractAnalysis]
      operationId: getLexContractAnalysis
      summary: Get the latest contract risk analysis.
      x-required-permission: lex:read
      responses:
        "200":
          description: Contract analysis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractAnalysisEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /contracts/{id}/analyze:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [ContractAnalysis]
      operationId: analyzeLexContract
      summary: Run contract analysis and clause extraction.
      x-required-permission: lex:write
      responses:
        "200":
          description: Completed analysis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractAnalysisEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /contracts/{id}/classify:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [ContractAnalysis]
      operationId: classifyLexContract
      summary: Classify a contract type.
      description: Recommends a contract type from supplied candidate text and can optionally apply the classification to the contract.
      x-required-permission: lex:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassifyContractRequest"
      responses:
        "200":
          description: Classification result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractClassificationResultEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /contracts/{id}/timeline:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Contracts]
      operationId: getLexContractTimeline
      summary: Get contract timeline events.
      x-required-permission: lex:read
      responses:
        "200":
          description: Contract timeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractTimelineEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /contracts/{id}/obligations/extract:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Obligations]
      operationId: extractLexContractObligations
      summary: Commit obligations extracted or supplied for a contract.
      description: |
        Creates deterministic obligation records from the request payload,
        optionally includes the contract renewal obligation, and can merge
        LLM-enriched candidates derived from persisted contract text when the
        Lex obligation enricher is enabled.
      x-required-permission: lex:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractObligationsRequest"
      responses:
        "201":
          description: Created obligations and planned notification events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObligationExtractionResultEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /contracts/{id}/upload:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Contracts]
      operationId: uploadLexContractDocument
      summary: Upload a new contract version reference.
      x-required-permission: lex:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadFileReferenceRequest"
      responses:
        "200":
          description: Contract versions after upload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractVersionListDataEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /contracts/{id}/status:
    parameters:
      - $ref: "#/components/parameters/ID"
    put:
      tags: [Contracts]
      operationId: updateLexContractStatus
      summary: Update contract lifecycle status.
      x-required-permission: lex:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContractStatusRequest"
      responses:
        "200":
          description: Updated contract.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /contracts/{id}/versions:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Contracts]
      operationId: listLexContractVersions
      summary: List contract document versions.
      x-required-permission: lex:read
      responses:
        "200":
          description: Contract versions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractVersionListDataEnvelope"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /contracts/{id}/redline:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [ContractAnalysis]
      operationId: getLexContractRedline
      summary: Compare two contract versions.
      x-required-permission: lex:read
      parameters:
        - name: base_version
          in: query
          schema:
            type: integer
            minimum: 1
        - name: target_version
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Redline comparison.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractRedlineEnvelope"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /contracts/{id}/renew:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Contracts]
      operationId: renewLexContract
      summary: Create a renewed contract record from an existing contract.
      x-required-permission: lex:write
      requestBody:
        required: true
        content:
          application/json:
