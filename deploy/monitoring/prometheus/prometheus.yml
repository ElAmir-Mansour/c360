      - source_labels: [__name__]
        regex: 'http_(.*)'
        target_label: __name__
        replacement: 'clario360_http_${1}'

  - job_name: "clario360-clario-dr-service"
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["clario-dr-service:9097"]
        labels:
          service: "clario-dr-service"
          suite: "datastream"
    metric_relabel_configs:
      # DR replication/RPO/RTO SLO metrics are already exported under the dr_*
      # namespace and consumed verbatim by the datastream alert rules, so they
      # are intentionally left un-relabeled. Only the shared instruments are
      # folded into the clario360_* namespace.
      - source_labels: [__name__]
        regex: 'db_(.*)'
        target_label: __name__
        replacement: 'clario360_db_${1}'
      - source_labels: [__name__]
        regex: 'kafka_(.*)'
        target_label: __name__
        replacement: 'clario360_kafka_${1}'
      - source_labels: [__name__]
        regex: 'http_(.*)'
        target_label: __name__
        replacement: 'clario360_http_${1}'

  - job_name: "clario360-automation-service"
    metrics_path: /metrics
    scheme: http
    # The automation admin server exposes /metrics on the x98 admin port
    # (AUTO_ADMIN_PORT, default 9098). In Kubernetes the deployment carries
    # prometheus.io/scrape pod annotations on 9098 for auto-discovery.
    static_configs:
      - targets: ["automation-service:9098"]
        labels:
          service: "automation-service"
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'db_(.*)'
        target_label: __name__
        replacement: 'clario360_db_${1}'
      - source_labels: [__name__]
        regex: 'kafka_(.*)'
        target_label: __name__
        replacement: 'clario360_kafka_${1}'
      - source_labels: [__name__]
        regex: 'http_(.*)'
        target_label: __name__
        replacement: 'clario360_http_${1}'

  - job_name: "clario360-migrate-service"
    metrics_path: /metrics
    scheme: http
    # The migrate admin server exposes /metrics on the admin port
    # (MIGRATE_ADMIN_PORT, default 9100). On the VPS pm2 box it is remapped to
    # 9099 (host minio holds :9100); in Kubernetes the deployment carries
    # prometheus.io/scrape pod annotations for auto-discovery.
    static_configs:
      - targets: ["migrate-service:9099"]
        labels:
          service: "migrate-service"
          suite: "migrate"
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'db_(.*)'
        target_label: __name__
        replacement: 'clario360_db_${1}'
      - source_labels: [__name__]
        regex: 'kafka_(.*)'
        target_label: __name__
        replacement: 'clario360_kafka_${1}'
      - source_labels: [__name__]
        regex: 'http_(.*)'
        target_label: __name__
        replacement: 'clario360_http_${1}'

